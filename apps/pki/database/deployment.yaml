apiVersion: apps/v1
kind: Deployment
metadata:
  name: pki-database
  namespace: pki
  labels:
    app: pki-database
    app.kubernetes.io/part-of: machine-identity-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pki-database
  template:
    metadata:
      labels:
        app: pki-database
    spec:
      serviceAccountName: cert-api
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        env:
        - name: POSTGRES_DB
          value: certinventory
        - name: POSTGRES_USER
          value: certapi
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pki-database-credentials
              key: password
        ports:
        - containerPort: 5432
          protocol: TCP
        volumeMounts:
        - name: pki-database-data
          mountPath: /var/lib/postgresql/data
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - certapi
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - certapi
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: pki-database-data
        persistentVolumeClaim:
          claimName: pki-database-data
---
apiVersion: v1
kind: Service
metadata:
  name: pki-database
  namespace: pki
  labels:
    app: pki-database
    app.kubernetes.io/part-of: machine-identity-platform
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
  selector:
    app: pki-database
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pki-database-data
  namespace: pki
  labels:
    app: pki-database
    app.kubernetes.io/part-of: machine-identity-platform
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-path
---
apiVersion: v1
kind: Secret
metadata:
  name: pki-database-credentials
  namespace: pki
  labels:
    app: pki-database
    app.kubernetes.io/part-of: machine-identity-platform
type: Opaque
stringData:
  password: "certinventory-password-change-me"
