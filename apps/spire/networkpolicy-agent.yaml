apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spire-agent
  namespace: spire
  labels:
    app: spire-agent
spec:
  podSelector:
    matchLabels:
      app: spire-agent
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: spire
    - podSelector:
        matchLabels:
          app: spire-server
    ports:
    - protocol: TCP
      port: 8081
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: spire
    - podSelector:
        matchLabels:
          app: spire-server
    ports:
    - protocol: TCP
      port: 8081
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 10250
    - protocol: TCP
      port: 443
