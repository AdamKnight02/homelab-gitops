# Agent overlay — for CAs that cannot be containerized (e.g. Microsoft ADCS).
# Deploys only the in-cluster gateway *client*; the agent itself runs on a
# Windows/Linux host near the CA and is installed outside GitOps.
apiVersion: v1
kind: ConfigMap
metadata:
  name: external-ca-gateway-config
  namespace: pki
data:
  provider: adcs
  mode: agent
  # External agent endpoint (mTLS). The agent presents a SPIFFE-issued or
  # platform-CA-issued client certificate.
  agentEndpoint: https://adcs-gateway.agent.internal:8443
---
# Probe the agent endpoint — alerts when the off-cluster agent is down.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: external-ca-adcs-agent
  namespace: monitoring
  labels:
    monitoring.pki.platform.io/enabled: "true"
    component: external-ca
spec:
  jobName: external-ca-adcs
  interval: 60s
  module: https_cert
  prober:
    url: blackbox-exporter.monitoring.svc:9115
    scheme: http
  targets:
    staticConfig:
      static:
        - https://adcs-gateway.agent.internal:8443/healthz
      labels:
        ca_provider: adcs
