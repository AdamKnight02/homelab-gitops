---
# AWS Overlay - AWS Environment (PLAN-ONLY or ephemeral test)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pki

resources:
  - ../../base

# AWS-specific patches
patches:
  - path: storage-class-patch.yaml
  - path: image-registry-patch.yaml
  - path: trust-domain-patch.yaml

# AWS-specific labels
commonLabels:
  environment: aws
  trust-domain: pki-aws.local

# AWS-specific images (placeholder for ECR)
images:
  - name: registry/cert-api
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/cert-api
    newTag: latest
  - name: registry/cert-worker
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/cert-worker
    newTag: latest
  - name: registry/ca-service
    newName: 123456789012.dkr.ecr.us-east-1.amazonaws.com/ca-service
    newTag: latest
