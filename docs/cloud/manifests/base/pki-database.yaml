---
# PKI PostgreSQL StatefulSet - Cloud-Neutral Base
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pki-database
  namespace: pki
  labels:
    app: pki-database
    app.kubernetes.io/name: pki-database
    app.kubernetes.io/part-of: machine-identity-platform
spec:
  serviceName: pki-database
  replicas: 1
  selector:
    matchLabels:
      app: pki-database
  template:
    metadata:
      labels:
        app: pki-database
        app.kubernetes.io/name: pki-database
        app.kubernetes.io/part-of: machine-identity-platform
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5432
          name: postgres
          protocol: TCP
        env:
        - name: POSTGRES_DB
          value: "pki"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: pki-database-credentials
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: pki-database-credentials
              key: password
        - name: PGDATA
          value: "/var/lib/postgresql/data/pgdata"
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - $(POSTGRES_USER)
            - -d
            - $(POSTGRES_DB)
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: data
          mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: local-path  # Overridden per environment
      resources:
        requests:
          storage: 5Gi
---
# PKI Database Service
apiVersion: v1
kind: Service
metadata:
  name: pki-database
  namespace: pki
  labels:
    app: pki-database
spec:
  type: ClusterIP
  selector:
    app: pki-database
  ports:
  - port: 5432
    targetPort: 5432
    name: postgres
---
# PKI Database NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pki-database
  namespace: pki
spec:
  podSelector:
    matchLabels:
      app: pki-database
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: pki
    ports:
    - protocol: TCP
      port: 5432
