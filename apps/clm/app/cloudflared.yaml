apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: clm
  labels:
    app: cloudflared
    app.kubernetes.io/part-of: clm
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          imagePullPolicy: Always
          args:
            - tunnel
            - --no-autoupdate
            - --protocol
            - http2   # QUIC/UDP-7844 unreliable through host NAT path;
                      # http2 uses TCP/443, proven working from this cluster
            - run
            - --token
            - $(TUNNEL_TOKEN)
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflared-token
                  key: token
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
