    provider: invalid
    integration_type: negative
    expected_result: "FAIL"
    requires:
      credentials: false
      network: false
      cluster: false
    test_steps:
      - "Submit configuration with provider='nonexistent-ca'"
      - "Verify validation rejects with clear error"
