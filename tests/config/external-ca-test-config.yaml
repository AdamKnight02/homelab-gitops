    provider: addon
    integration_type: lifecycle
    expected_result: "BLOCKED"
    requires:
      credentials: true
      network: true
      cluster: true
    test_steps:
      - "Deploy platform with internal CA only"
      - "Add external CA configuration"
      - "Verify external CA is registered"
