# Main monitoring stack Application — kube-prometheus-stack.
#
# Multi-source pattern (matches apps/openbao/application.yaml convention):
#   source 1: Helm chart (prometheus-community/kube-prometheus-stack)
#   source 2: $values ref -> base + tier + provider value files
#   source 3: raw manifests (grafana admin secret)
#
# TIER and PROVIDER are selected by which Application manifest you deploy:
#   application-economy-homelab.yaml, application-standard-azure.yaml, etc.
# This file is the homelab/economy default used by the local lab.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: machine-identity-platform
    pki.platform.io/tier: economy
    pki.platform.io/provider: homelab
spec:
  project: default

  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.5.1
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/gitops/monitoring/base/prometheus-stack/values.yaml
          - $values/gitops/monitoring/overlays/economy/values.yaml
          - $values/gitops/monitoring/providers/homelab/values.yaml

    - repoURL: https://github.com/AdamKnight02/homelab-gitops.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/AdamKnight02/homelab-gitops.git
      targetRevision: main
      path: gitops/monitoring/base/prometheus-stack

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  # CRDs are large; skip dry-run on them to avoid sync failures.
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jqPathExpressions:
        - .metadata.annotations."controller-gen.kubebuilder.io/version"

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
