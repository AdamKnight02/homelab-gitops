  # =========================================================================
  # STAGE 7: REPORT
  # =========================================================================
  - stage: Report
    displayName: 'Generate Report'
    dependsOn: SmokeTests
    condition: succeededOrFailed()
    jobs:
      - job: GenerateReport
        displayName: 'Generate Deployment Report'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Bash@3
            displayName: 'Generate Report'
            inputs:
              targetType: 'inline'
              script: |
                set -e
                mkdir -p $(Build.ArtifactStagingDirectory)/report
                cat > $(Build.ArtifactStagingDirectory)/report/deployment-report.md <<EOF
                # Deployment Report

                ## Summary
                - **Customer:** ${{ parameters.customer_id }}
                - **Environment:** ${{ parameters.environment }}
                - **Service Tier:** ${{ parameters.service_tier }}
                - **Region Class:** ${{ parameters.region_class }}
                - **Operation:** ${{ parameters.operation }}
                - **Timestamp:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")

                ## Configuration
                - **SCEP Enabled:** ${{ parameters.scep_enabled }}
                - **ACME Enabled:** ${{ parameters.acme_enabled }}
                - **External CA:** ${{ parameters.external_ca }}
                - **Monitoring Enabled:** ${{ parameters.monitoring_enabled }}

                ## Pipeline Status
                - **Build ID:** $(Build.BuildId)
                - **Build Number:** $(Build.BuildNumber)
                - **Source Branch:** $(Build.SourceBranch)
                - **Source Version:** $(Build.SourceVersion)

                ## Stages
                | Stage | Status |
                |-------|--------|
                | Validate | $(Agent.JobStatus) |
                | Plan | $(Agent.JobStatus) |
                | Approval | $(Agent.JobStatus) |
                | Deploy Infrastructure | $(Agent.JobStatus) |
                | Deploy Platform | $(Agent.JobStatus) |
                | Smoke Tests | $(Agent.JobStatus) |

                ## Notes
                This is an auto-generated report from the Azure Deploy Customer Pipeline.
                EOF
                cat $(Build.ArtifactStagingDirectory)/report/deployment-report.md

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Report'
            inputs:
              targetPath: '$(Build.ArtifactStagingDirectory)/report'
              artifact: 'deployment-report'
              publishLocation: 'pipeline'

      - job: PublishResults
        displayName: 'Publish Test Results'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Bash@3
            displayName: 'Publish Results'
            inputs:
              targetType: 'inline'
              script: |
                set -e
                echo "Publishing test results..."
                echo "Placeholder: Would publish JUnit XML results to Azure DevOps"
                echo "Results publishing completed"

      - job: NotifyStakeholders
        displayName: 'Notify Stakeholders'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: Bash@3
            displayName: 'Send Notifications'
            inputs:
              targetType: 'inline'
              script: |
                set -e
                echo "Sending notifications..."
                echo "Placeholder: Would send notifications via:"
                echo "  - Email"
                echo "  - Teams webhook"
                echo "  - Slack webhook"
                echo ""
                echo "Deployment ${{ parameters.operation }} for ${{ parameters.customer_id }} completed."
                echo "Notifications sent (placeholder)"
