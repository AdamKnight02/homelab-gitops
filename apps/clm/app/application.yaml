apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: clm-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: clm-app
    app.kubernetes.io/part-of: clm
spec:
  project: default
  source:
    repoURL: https://github.com/AdamKnight02/homelab-gitops.git
    targetRevision: main
    path: apps/clm/app
  destination:
    server: https://kubernetes.default.svc
    namespace: clm
  syncPolicy:
    # CONTAINMENT 2026-10-27: automated sync disabled during incident recovery; restore after stabilization
    syncOptions:
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
