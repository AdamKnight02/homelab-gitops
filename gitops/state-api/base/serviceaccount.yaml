apiVersion: v1
kind: ServiceAccount
metadata:
  name: state-api
  namespace: state-system
  labels:
    app.kubernetes.io/name: state-api
automountServiceAccountToken: true
---
# Workload identity bindings (cloud IAM → K8s SA) are applied by provider
# overlays:
#   Azure:   azure.workload.identity/client-id annotation + federated credential
#   AWS:     eks.amazonaws.com/role-arn annotation (IRSA)
#   Alibaba: RRSA oidc provider annotation
# See overlays/<provider>/ for the annotated SA patch.
