apiVersion: batch/v1
kind: CronJob
metadata:
  name: cert-renewal-check
  namespace: pki
  labels:
    app: cert-renewal-check
    app.kubernetes.io/part-of: machine-identity-platform
spec:
  schedule: "0 */6 * * *"  # Every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app: cert-renewal-check
    spec:
      template:
        spec:
          serviceAccountName: cert-worker
          restartPolicy: OnFailure
          containers:
          - name: renewal-check
            image: 10.42.0.88:5000/cert-worker:latest
            imagePullPolicy: IfNotPresent
            command: ["python", "-c"]
            args:
            - |
              import os
              import sys
              import httpx
              import structlog
              from datetime import datetime, timedelta
              
              logger = structlog.get_logger()
              
              CERT_API_URL = os.getenv("CERT_API_URL", "http://cert-api:8000")
              RENEWAL_THRESHOLD_DAYS = int(os.getenv("RENEWAL_THRESHOLD_DAYS", "30"))
              AUTO_RENEW = os.getenv("AUTO_RENEW", "true").lower() == "true"
              
              def check_and_renew():
                  try:
                      logger.info("renewal.check.started", threshold=RENEWAL_THRESHOLD_DAYS)
                      
                      # Get expiring certificates
                      response = httpx.get(
                          f"{CERT_API_URL}/api/v1/certificates/expiring",
                          params={"days": RENEWAL_THRESHOLD_DAYS},
                          timeout=30.0
                      )
                      response.raise_for_status()
                      result = response.json()
                      certs = result.get("certificates", [])
                      
                      if not certs:
                          logger.info("renewal.no_certificates_needed")
                          return 0
                      
                      logger.info("renewal.certificates_found", count=len(certs))
                      
                      renewed = 0
                      failed = 0
                      skipped = 0
                      
                      for cert in certs:
                          serial = cert["serial_number"]
                          hostname = cert.get("hostname", "unknown")
                          days = cert.get("days_remaining", 0)
                          source = cert.get("source_ca", "unknown")
                          
                          logger.info("renewal.processing",
                                    serial=serial,
                                    hostname=hostname,
                                    days_remaining=days,
                                    source=source)
                          
                          if not AUTO_RENEW:
                              logger.info("renewal.skipped_auto_disabled",
                                        serial=serial)
                              skipped += 1
                              continue
                          
                          try:
                              # Attempt renewal
                              renew_resp = httpx.post(
                                  f"{CERT_API_URL}/api/v1/certificates/{serial}/renew",
                                  timeout=120.0
                              )
                              
                              if renew_resp.status_code == 200:
                                  renewed += 1
                                  logger.info("renewal.success",
                                            serial=serial,
                                            hostname=hostname)
                              else:
                                  failed += 1
                                  logger.error("renewal.failed",
                                             serial=serial,
                                             status=renew_resp.status_code,
                                             detail=renew_resp.text)
                              
                          except Exception as e:
                              failed += 1
                              logger.error("renewal.error",
                                         serial=serial,
                                         error=str(e))
                      
                      logger.info("renewal.check.completed",
                                renewed=renewed,
                                failed=failed,
                                skipped=skipped,
                                total=len(certs))
                      
                      return 0 if failed == 0 else 1
                      
                  except Exception as e:
                      logger.error("renewal.check.failed", error=str(e))
                      return 1
              
              sys.exit(check_and_renew())
            env:
            - name: CERT_API_URL
              value: "http://cert-api:8000"
            - name: RENEWAL_THRESHOLD_DAYS
              value: "30"
            - name: AUTO_RENEW
              value: "true"
            - name: DATABASE_URL
              value: "postgresql://certapi:certinventory-password-change-me@pki-database:5432/certinventory"
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 256Mi
