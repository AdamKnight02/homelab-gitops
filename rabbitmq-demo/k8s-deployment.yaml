apiVersion: v1
kind: Namespace
metadata:
  name: rabbitmq-demo
---
# ConfigMap with scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-demo-scripts
  namespace: rabbitmq-demo
data:
  producer.py: |
    #!/usr/bin/env python3
    import pika
    import json
    import time
    
    def get_connection():
        credentials = pika.PlainCredentials('admin', 'admin123')
        parameters = pika.ConnectionParameters(
            host='rabbitmq.rabbitmq.svc.cluster.local',
            port=5672,
            credentials=credentials,
            connection_attempts=5,
            retry_delay=5
        )
        return pika.BlockingConnection(parameters)
    
    def send_task(task_type, data):
        connection = get_connection()
        channel = connection.channel()
        channel.queue_declare(queue='task_queue', durable=True)
        
        message = {
            'task_type': task_type,
            'data': data,
            'timestamp': time.time()
        }
        
        channel.basic_publish(
            exchange='',
            routing_key='task_queue',
            body=json.dumps(message),
            properties=pika.BasicProperties(delivery_mode=2)
        )
        
        print(f" [x] Sent {task_type}: {data}")
        connection.close()
    
    if __name__ == '__main__':
        tasks = [
            ('process_order', {'order_id': '12345', 'amount': 99.99}),
            ('send_email', {'to': 'user@example.com', 'template': 'welcome'}),
            ('generate_report', {'type': 'daily', 'date': '2026-08-22'}),
        ]
        
        for task_type, data in tasks:
            send_task(task_type, data)
            time.sleep(1)
        
        print(" [+] All tasks sent!")
  
  consumer.py: |
    #!/usr/bin/env python3
    import pika
    import json
    import time
    import os
    
    def get_connection():
        credentials = pika.PlainCredentials('admin', 'admin123')
        parameters = pika.ConnectionParameters(
            host='rabbitmq.rabbitmq.svc.cluster.local',
            port=5672,
            credentials=credentials,
            connection_attempts=5,
            retry_delay=5
        )
        return pika.BlockingConnection(parameters)
    
    def get_secret_from_openbao(secret_path):
        try:
            bao_addr = os.getenv('BAO_ADDR', 'https://openbao.openbao.svc.cluster.local:8200')
            print(f"    [OpenBao] Would fetch secret from: {bao_addr}/v1/secret/data/{secret_path}")
            return {'username': 'demo_user', 'password': 'demo_pass'}
        except Exception as e:
            print(f"    [OpenBao] Error: {e}")
            return None
    
    def process_task(body):
        message = json.loads(body)
        task_type = message['task_type']
        data = message['data']
        
        print(f" [→] Processing {task_type}: {data}")
        time.sleep(2)
        
        if task_type == 'process_order':
            db_creds = get_secret_from_openbao('database/orders')
            print(f"    [DB] Connected with user: {db_creds['username']}")
            print(f"    [DB] Processing order {data['order_id']} for ${data['amount']}")
        elif task_type == 'send_email':
            print(f"    [Email] Sending {data['template']} email to {data['to']}")
        elif task_type == 'generate_report':
            print(f"    [Report] Generating {data['type']} report for {data['date']}")
        
        print(f" [✓] Completed {task_type}")
    
    def callback(ch, method, properties, body):
        try:
            process_task(body)
            ch.basic_ack(delivery_tag=method.delivery_tag)
        except Exception as e:
            print(f" [✗] Error: {e}")
            ch.basic_nack(delivery_tag=method.delivery_tag, requeue=True)
    
    def main():
        connection = get_connection()
        channel = connection.channel()
        channel.queue_declare(queue='task_queue', durable=True)
        channel.basic_qos(prefetch_count=1)
        channel.basic_consume(queue='task_queue', on_message_callback=callback)
        
        print(' [*] Waiting for tasks. To exit press CTRL+C')
        channel.start_consuming()
    
    if __name__ == '__main__':
        main()
---
# Worker Deployment (Consumer)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq-worker
  namespace: rabbitmq-demo
spec:
  replicas: 2  # Scale up workers as needed
  selector:
    matchLabels:
      app: rabbitmq-worker
  template:
    metadata:
      labels:
        app: rabbitmq-worker
    spec:
      containers:
      - name: worker
        image: python:3.11-slim
        command: ["python", "/app/consumer.py"]
        volumeMounts:
        - name: scripts
          mountPath: /app
        resources:
          requests:
            memory: 128Mi
            cpu: 50m
          limits:
            memory: 256Mi
            cpu: 200m
      volumes:
      - name: scripts
        configMap:
          name: rabbitmq-demo-scripts
          defaultMode: 0755
---
# Job to run producer once
apiVersion: batch/v1
kind: Job
metadata:
  name: rabbitmq-producer
  namespace: rabbitmq-demo
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: producer
        image: python:3.11-slim
        command: ["python", "/app/producer.py"]
        volumeMounts:
        - name: scripts
          mountPath: /app
      volumes:
      - name: scripts
        configMap:
          name: rabbitmq-demo-scripts
          defaultMode: 0755
      initContainers:
      - name: wait-for-rabbitmq
        image: busybox
        command: ['sh', '-c', 'until nc -z rabbitmq.rabbitmq.svc.cluster.local 5672; do echo waiting for rabbitmq; sleep 2; done;']
---
# Argo CD Application
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rabbitmq-demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yourusername/rabbitmq-demo.git  # Change this
    targetRevision: HEAD
    path: .
  destination:
    server: https://kubernetes.default.svc
    namespace: rabbitmq-demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true