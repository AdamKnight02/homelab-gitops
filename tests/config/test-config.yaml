# =============================================================================
# PKI Platform Test Configuration
# =============================================================================
# Central configuration for all test levels, profiles, and endpoints.
# Credentials are referenced by name only — actual values come from
# environment variables or secret stores (OpenBao, Azure Key Vault, etc.)
# =============================================================================

version: "1.0"
generated: "2026-09-12"

# -----------------------------------------------------------------------------
# Test Profiles
# -----------------------------------------------------------------------------
profiles:
  static:
    description: "Static validation only — no cluster or cloud needed"
    levels: [1, "matrix"]
    requires:
      cluster: false
      cloud_credentials: false
      network: false

  quick:
    description: "Quick smoke test — static + matrix"
    levels: [1, "matrix"]
    requires:
      cluster: false
      cloud_credentials: false
      network: false

  cloud:
    description: "Cloud infrastructure validation"
    levels: [1, 2, "matrix"]
    requires:
      cluster: false
      cloud_credentials: true
      network: true

  platform:
    description: "Full platform health check"
    levels: [1, 3, 4]
    requires:
      cluster: true
      cloud_credentials: false
      network: true

  pki:
    description: "PKI protocol and operations testing"
    levels: [1, 3, 4, 5]
    requires:
      cluster: true
      cloud_credentials: false
      network: true
      ejbca: true

  full:
    description: "All tests including lifecycle (destructive)"
    levels: [1, 2, 3, 4, 5, 6, 7, "matrix", "extca"]
    requires:
      cluster: true
      cloud_credentials: true
      network: true
      ejbca: true
      ephemeral: true

  ci:
    description: "CI/CD pipeline — static + matrix + external CA validation"
    levels: [1, "matrix", "extca"]
    requires:
      cluster: false
      cloud_credentials: false
      network: false

# -----------------------------------------------------------------------------
# Cloud Provider Endpoints
# -----------------------------------------------------------------------------
providers:
  azure:
    cli_tool: "az"
    auth_check: ["az", "account", "show", "-o", "json"]
    terraform_dir: "infra/terraform/azure"
    resource_prefix: "pki"
    tiers:
      economy:
        vm_size: "Standard_B1s"
        estimated_cost: "~$8/month"
      standard:
        vm_size: "Standard_B2s"
        estimated_cost: "~$32/month"
      enterprise:
        vm_size: "Standard_D2s_v5"
        estimated_cost: "~$70/month"
    status: "authenticated"

  aws:
    cli_tool: "aws"
    auth_check: ["aws", "sts", "get-caller-identity", "--output", "json"]
    terraform_dir: "infra/terraform/aws"
    resource_prefix: "pki-cloudlab"
    tiers:
      economy:
        instance_type: "t3.micro"
        estimated_cost: "~$8/month (free-tier eligible)"
      standard:
        instance_type: "t3.small"
        estimated_cost: "~$15/month"
      enterprise:
        instance_type: "t3.medium"
        estimated_cost: "~$30/month"
    status: "authenticated"

  alibaba:
    cli_tool: "aliyun"
    auth_check: ["aliyun", "sts", "GetCallerIdentity"]
    terraform_dir: "infra/terraform/alibaba"
    resource_prefix: "pki"
    tiers:
      economy:
        instance_type: "ecs.t6-c1m1.large"
        estimated_cost: "~$10/month"
      standard:
        instance_type: "ecs.t6-c1m2.large"
        estimated_cost: "~$20/month"
      enterprise:
        instance_type: "ecs.c6.large"
        estimated_cost: "~$50/month"
    status: "blocked"
    blocked_reason: "Alibaba Cloud CLI (aliyun) not installed"

# -----------------------------------------------------------------------------
# Kubernetes / Cluster Configuration
# -----------------------------------------------------------------------------
kubernetes:
  context: "default"
  kubeconfig_env: "KUBECONFIG"
  ssh_host: "openclaw@192.168.122.74"
  ssh_key: "~/.ssh/openclaw_k8s01"
  expected_namespaces:
    - argocd
    - cert-manager
    - ejbca
    - monitoring
    - openbao
    - pki
    - rabbitmq
    - registry
    - spire
  argocd_namespace: "argocd"
  argocd_expected_apps: 10

# -----------------------------------------------------------------------------
# PKI Test Configuration
# -----------------------------------------------------------------------------
pki:
  # NEVER use production CA material in tests
  test_ca_name: "LabIssuingCA"
  test_cert_profile: "TestServerProfile"
  test_ee_profile: "TestEndEntityProfile"
  test_end_entity_prefix: "test-qa-"
  test_domain_suffix: ".pki-cloudlab.local"
  test_key_size: 2048
  test_key_algorithm: "RSA"

  # EJBCA endpoints (accessed via kubectl exec)
  ejbca:
    namespace: "ejbca"
    pod_selector: "app.kubernetes.io/name=ejbca-ce"
    admin_web: "https://localhost:8443/ejbca/ejbcaweb/"
    health_check: "https://localhost:8443/ejbca/publicweb/healthcheck/ejbcahealth"
    ocsp_endpoint: "https://localhost:8443/ejbca/publicweb/status/ocsp"
    crl_endpoint: "https://localhost:8443/ejbca/publicweb/webdist/certdist"
    acme_endpoint: "https://localhost:8443/ejbca/acme/directory"
    scep_endpoint: "https://localhost:8443/ejbca/publicweb/apply/scep/pkiclient.exe"
    ws_cli: "/opt/keyfactor/ejbca-ce/bin/ejbca.sh"

  # Platform services
  services:
    cert_api:
      namespace: "pki"
      label: "app=cert-api"
    cert_worker:
      namespace: "pki"
      label: "app=cert-worker"
    pki_database:
      namespace: "pki"
      label: "app=pki-database"
    openbao:
      namespace: "openbao"
      label: "app.kubernetes.io/name=openbao"
    spire_server:
      namespace: "spire"
      label: "app=spire-server"
    spire_agent:
      namespace: "spire"
      label: "app=spire-agent"
    prometheus:
      namespace: "monitoring"
      label: "app.kubernetes.io/name=prometheus"
    grafana:
      namespace: "monitoring"
      label: "app.kubernetes.io/name=grafana"
    rabbitmq:
      namespace: "rabbitmq"
      label: "app.kubernetes.io/name=rabbitmq"
    postgresql:
      namespace: "ejbca"
      label: "app.kubernetes.io/name=postgresql"

# -----------------------------------------------------------------------------
# Credential References (NEVER store actual values here)
# -----------------------------------------------------------------------------
credentials:
  azure:
    method: "azure-cli"
    env_vars: []
    notes: "Uses az login session"

  aws:
    method: "aws-cli-profile"
    env_vars:
      - "AWS_PROFILE"
      - "AWS_ACCESS_KEY_ID"
      - "AWS_SECRET_ACCESS_KEY"
    notes: "Uses aws configure or environment variables"

  alibaba:
    method: "aliyun-cli"
    env_vars:
      - "ALIBABA_CLOUD_ACCESS_KEY_ID"
      - "ALIBABA_CLOUD_ACCESS_KEY_SECRET"
    notes: "BLOCKED — aliyun CLI not installed"

  digicert:
    method: "api-key"
    env_vars:
      - "DIGICERT_API_KEY"
      - "DIGICERT_ACCOUNT_ID"
    secret_store: "openbao:pki/digicert"

  letsencrypt:
    method: "acme-account"
    env_vars:
      - "LETSENCRYPT_EMAIL"
    notes: "No API key needed; uses ACME protocol"

  custom_ca:
    method: "api-key"
    env_vars:
      - "EXTERNAL_CA_URL"
      - "EXTERNAL_CA_TOKEN"
    secret_store: "openbao:pki/custom-ca"

# -----------------------------------------------------------------------------
# Tool Availability
# -----------------------------------------------------------------------------
tools:
  required:
    - terraform
    - kubectl
    - jq
  optional:
    - helm
    - kustomize
    - yq
  blocked:
    - pwsh          # PowerShell — not installed, use static fallback
    - aliyun         # Alibaba Cloud CLI — not installed
  available:
    - az             # Azure CLI — authenticated
    - aws            # AWS CLI — authenticated

# -----------------------------------------------------------------------------
# Report Configuration
# -----------------------------------------------------------------------------
reports:
  output_dir: "tests/reports"
  formats:
    - json
    - text
  json_filename: "test-report.json"
  text_filename: "test-report.txt"
  include_environment: true
  include_traceback: true
