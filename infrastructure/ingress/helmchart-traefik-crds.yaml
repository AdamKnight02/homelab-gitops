# Traefik CRDs (split from the main chart in upstream 41.x).
# Mirrors the source cluster's traefik-crd release; provides IngressRoute,
# Middleware, TLSOption, etc. Plain kubernetes Ingress (used by clm-ui)
# does not require these, but parity with the source keeps options open.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: traefik-crds
  namespace: kube-system
spec:
  repo: https://traefik.github.io/charts
  chart: traefik-crds
  version: "1.18.0"
  targetNamespace: kube-system
