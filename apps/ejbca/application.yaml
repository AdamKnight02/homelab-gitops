apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ejbca
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: oci://repo.keyfactor.com/charts/ejbca-ce
      targetRevision: 9.3.7
      path: .
      helm:
        releaseName: ejbca
        valueFiles:
          - $values/apps/ejbca/values.yaml

    - repoURL: https://github.com/AdamKnight02/homelab-gitops.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: ejbca

  syncPolicy:
    syncOptions:
      - CreateNamespace=false