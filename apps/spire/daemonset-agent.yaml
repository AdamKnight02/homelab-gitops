apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire
  labels:
    app: spire-agent
spec:
  selector:
    matchLabels:
      app: spire-agent
  template:
    metadata:
      labels:
        app: spire-agent
    spec:
      serviceAccountName: spire-agent
      dnsPolicy: ClusterFirst
      initContainers:
      - name: init
        image: busybox:1.37.0
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - mkdir -p /run/spire/sockets && chown -R 1000:1000 /run/spire
        volumeMounts:
        - name: spire-socket
          mountPath: /run/spire/sockets
      containers:
      - name: spire-agent
        image: ghcr.io/spiffe/spire-agent:1.10.0
        imagePullPolicy: IfNotPresent
        args:
        - -config
        - /run/spire/config/agent.conf
        securityContext:
          privileged: true
        volumeMounts:
        - name: spire-config
          mountPath: /run/spire/config
          readOnly: true
        - name: spire-socket
          mountPath: /run/spire/sockets
        - name: spire-token
          mountPath: /var/run/secrets/tokens
      volumes:
      - name: spire-config
        configMap:
          name: spire-agent
      - name: spire-socket
        hostPath:
          path: /run/spire/sockets
          type: DirectoryOrCreate
      - name: spire-token
        projected:
          sources:
          - serviceAccountToken:
              audience: spire-server
              expirationSeconds: 7200
              path: spire-agent
