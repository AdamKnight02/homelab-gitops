apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dash-platform-health
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PKI Platform
data:
  platform-health.json: |
    {
      "uid": "pki-platform-health",
      "title": "Platform Health",
      "tags": ["pki", "platform", "kubernetes"],
      "timezone": "browser",
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Platform Pods Ready",
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 0.9}, {"color": "green", "value": 0.99}]}}},
          "targets": [{"expr": "sum(kube_pod_status_ready{namespace=~\"pki|ejbca|openbao|spire|cert-manager|postgres\", condition=\"true\"}) / sum(kube_pod_status_ready{namespace=~\"pki|ejbca|openbao|spire|cert-manager|postgres\"})"}]
        },
        {
          "id": 2, "type": "stat", "title": "Pod Restarts (1h)",
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 0},
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 3}, {"color": "red", "value": 10}]}}},
          "targets": [{"expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"pki|ejbca|openbao|spire|cert-manager|postgres\"}[1h]))"}]
        },
        {
          "id": 3, "type": "stat", "title": "Active Alerts",
          "gridPos": {"h": 6, "w": 6, "x": 12, "y": 0},
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}}},
          "targets": [{"expr": "count(ALERTS{alertstate=\"firing\"})"}]
        },
        {
          "id": 4, "type": "stat", "title": "Critical Alerts",
          "gridPos": {"h": 6, "w": 6, "x": 18, "y": 0},
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}},
          "targets": [{"expr": "count(ALERTS{alertstate=\"firing\", severity=\"critical\"})"}]
        },
        {
          "id": 5, "type": "timeseries", "title": "CPU Usage by Namespace",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6},
          "fieldConfig": {"defaults": {"unit": "cores"}},
          "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=~\"pki|ejbca|openbao|spire|cert-manager|postgres\", container!=\"\"}[5m])) by (namespace)", "legendFormat": "{{ namespace }}"}]
        },
        {
          "id": 6, "type": "timeseries", "title": "Memory Usage by Namespace",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6},
          "fieldConfig": {"defaults": {"unit": "bytes"}},
          "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace=~\"pki|ejbca|openbao|spire|cert-manager|postgres\", container!=\"\"}) by (namespace)", "legendFormat": "{{ namespace }}"}]
        },
        {
          "id": 7, "type": "table", "title": "Component Status Matrix",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 14},
          "targets": [{"expr": "up{job=~\".*ejbca.*|.*cert-manager.*|.*rabbitmq.*|.*spire.*|.*openbao.*|.*postgres.*|.*cert-api.*|.*cert-worker.*\"}", "format": "table", "instant": true}]
        },
        {
          "id": 8, "type": "timeseries", "title": "PVC Usage",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 22},
          "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.75}, {"color": "red", "value": 0.9}]}}},
          "targets": [{"expr": "1 - kubelet_volume_stats_available_bytes{namespace=~\"pki|ejbca|openbao|postgres|monitoring\"} / kubelet_volume_stats_capacity_bytes", "legendFormat": "{{ persistentvolumeclaim }}"}]
        }
      ],
      "schemaVersion": 39,
      "version": 1
    }
