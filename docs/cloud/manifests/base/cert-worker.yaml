---
# cert-worker Deployment - Cloud-Neutral Base
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-worker
  namespace: pki
  labels:
    app: cert-worker
    app.kubernetes.io/name: cert-worker
    app.kubernetes.io/part-of: machine-identity-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cert-worker
  template:
    metadata:
      labels:
        app: cert-worker
        app.kubernetes.io/name: cert-worker
        app.kubernetes.io/part-of: machine-identity-platform
        spiffe.io/spire-managed-identity: "true"
    spec:
      serviceAccountName: cert-worker
      containers:
      - name: worker
        image: registry/cert-worker:latest  # Overridden per environment
        imagePullPolicy: IfNotPresent
        env:
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: url
        - name: CA_SERVICE_URL
          value: "http://ca-service.pki.svc:8000"
        - name: OPENBAO_ADDR
          value: "https://openbao.openbao.svc:8200"
        - name: OPENBAO_CACERT
          value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        - name: SPIFFE_SOCKET_PATH
          value: "/spiffe-socket/agent.sock"
        - name: LOG_LEVEL
          value: "INFO"
        - name: WORKER_QUEUE
          value: "cert.issue"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "ps aux | grep -v grep | grep cert-worker"
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - "rabbitmq-diagnostics check_port_connectivity -q || exit 0"
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: spiffe-socket
          mountPath: /spiffe-socket
          readOnly: true
      volumes:
      - name: spiffe-socket
        csi:
          driver: "csi.spiffe.io"
          readOnly: true
---
# cert-worker ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-worker
  namespace: pki
  labels:
    app.kubernetes.io/name: cert-worker
    app.kubernetes.io/part-of: machine-identity-platform
    spiffe.io/spire-managed-identity: "true"
automountServiceAccountToken: true
---
# cert-worker NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-worker
  namespace: pki
spec:
  podSelector:
    matchLabels:
      app: cert-worker
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: rabbitmq
    ports:
    - protocol: TCP
      port: 5672
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: pki
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openbao
    ports:
    - protocol: TCP
      port: 8200
  - to:  # DNS
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
