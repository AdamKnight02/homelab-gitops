---
# cert-api Deployment - Cloud-Neutral Base
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cert-api
  namespace: pki
  labels:
    app: cert-api
    app.kubernetes.io/name: cert-api
    app.kubernetes.io/part-of: machine-identity-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cert-api
  template:
    metadata:
      labels:
        app: cert-api
        app.kubernetes.io/name: cert-api
        app.kubernetes.io/part-of: machine-identity-platform
        spiffe.io/spire-managed-identity: "true"
    spec:
      serviceAccountName: cert-api
      containers:
      - name: api
        image: registry/cert-api:latest  # Overridden per environment
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: pki-database-credentials
              key: url
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: rabbitmq-credentials
              key: url
        - name: OPENBAO_ADDR
          value: "https://openbao.openbao.svc:8200"
        - name: OPENBAO_CACERT
          value: "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        - name: SPIFFE_SOCKET_PATH
          value: "/spiffe-socket/agent.sock"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        volumeMounts:
        - name: spiffe-socket
          mountPath: /spiffe-socket
          readOnly: true
      volumes:
      - name: spiffe-socket
        csi:
          driver: "csi.spiffe.io"
          readOnly: true
---
# cert-api Service
apiVersion: v1
kind: Service
metadata:
  name: cert-api
  namespace: pki
  labels:
    app: cert-api
spec:
  type: ClusterIP
  selector:
    app: cert-api
  ports:
  - port: 8000
    targetPort: 8000
    name: http
---
# cert-api ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-api
  namespace: pki
  labels:
    app.kubernetes.io/name: cert-api
    app.kubernetes.io/part-of: machine-identity-platform
    spiffe.io/spire-managed-identity: "true"
automountServiceAccountToken: true
---
# cert-api NetworkPolicy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-api
  namespace: pki
spec:
  podSelector:
    matchLabels:
      app: cert-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress
    ports:
    - protocol: TCP
      port: 8000
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: rabbitmq
    ports:
    - protocol: TCP
      port: 5672
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openbao
    ports:
    - protocol: TCP
      port: 8200
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: pki
    ports:
    - protocol: TCP
      port: 5432
  - to:  # DNS
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
