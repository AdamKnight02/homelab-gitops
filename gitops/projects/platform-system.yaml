# Platform System Project
# Core platform components (Argo CD, cert-manager, monitoring)

apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-system
  namespace: argocd
spec:
  description: "Platform system components"
  sourceRepos:
    - 'https://github.com/AdamKnight02/homelab-gitops.git'
    - 'https://charts.jetstack.io'  # cert-manager
    - 'https://prometheus-community.github.io/helm-charts'
    - 'https://grafana.github.io/helm-charts'
  destinations:
    - namespace: 'argocd'
      server: https://kubernetes.default.svc
    - namespace: 'cert-manager'
      server: https://kubernetes.default.svc
    - namespace: 'monitoring'
      server: https://kubernetes.default.svc
    - namespace: 'kube-system'
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ''
      kind: Namespace
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRole
    - group: 'rbac.authorization.k8s.io'
      kind: ClusterRoleBinding
    - group: 'apiextensions.k8s.io'
      kind: CustomResourceDefinition
    - group: 'admissionregistration.k8s.io'
      kind: MutatingWebhookConfiguration
    - group: 'admissionregistration.k8s.io'
      kind: ValidatingWebhookConfiguration
  namespaceResourceBlacklist:
    - group: ''
      kind: Secret
  roles:
    - name: platform-admin
      description: Platform administrator
      policies:
        - p, proj:platform-system:platform-admin, applications, *, platform-system/*, allow
        - p, proj:platform-system:platform-admin, repositories, *, *, allow
        - p, proj:platform-system:platform-admin, clusters, *, *, allow
      groups:
        - platform-admins
