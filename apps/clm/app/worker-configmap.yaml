# CLM worker configuration (non-secret). Secrets come from clm-postgres-auth /
# clm-rabbitmq-auth via secretKeyRef.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clm-worker-config
  namespace: clm
  labels:
    app.kubernetes.io/part-of: clm
data:
  LOG_LEVEL: "INFO"
  METRICS_PORT: "9090"
  JOB_MAX_ATTEMPTS: "5"
  JOB_BASE_BACKOFF_SECONDS: "15"
  JOB_MAX_BACKOFF_SECONDS: "900"
  JOB_RUNNING_TIMEOUT_SECONDS: "600"
  JANITOR_INTERVAL_SECONDS: "10"
  RABBIT_PREFETCH: "4"
