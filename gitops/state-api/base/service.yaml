apiVersion: v1
kind: Service
metadata:
  name: state-api
  namespace: state-system
  labels:
    app.kubernetes.io/name: state-api
spec:
  type: ClusterIP # INTERNAL ONLY — never LoadBalancer/NodePort by default
  selector:
    app.kubernetes.io/name: state-api
  ports:
    - name: http
      port: 8080
      targetPort: http
