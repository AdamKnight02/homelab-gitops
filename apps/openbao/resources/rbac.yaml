apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-service-registration
  namespace: openbao
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-service-registration
  namespace: openbao
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: openbao
roleRef:
  kind: Role
  name: openbao-service-registration
  apiGroup: rbac.authorization.k8s.io
