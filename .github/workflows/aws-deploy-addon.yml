name: AWS Add-On Infrastructure Deployment

"on":
  workflow_dispatch:
    inputs:
      customer_id:
        description: "Customer ID"
        required: true
        type: string
      environment:
        description: "Environment"
        required: true
        type: string
      addon_type:
        description: "Add-On Type"
        required: true
        type: choice
        options:
          - external_ca
          - scep
          - acme
          - monitoring
          - additional_gateway
          - additional_worker
      external_ca_provider:
        description: "External CA Provider"
        required: false
        type: string
        default: "none"
      deployment_profile:
        description: "Deployment Profile"
        required: true
        type: choice
        options:
          - economy
          - standard
          - enterprise
        default: standard
      operation:
        description: "Operation"
        required: true
        type: choice
        options:
          - deploy
          - plan
          - remove
        default: deploy

env:
  TF_WORKING_DIR: infra/terraform/aws
  AWS_REGION: us-east-1
  MAX_RESOURCE_COUNT: 50
  TF_STATE_KEY: ${{ github.event.inputs.customer_id }}/${{ github.event.inputs.environment }}/addon-${{ github.event.inputs.addon_type }}.tfstate

jobs:
  # ============================================================================
  # JOB 1: VALIDATE
  # ============================================================================
  validate:
    name: "Validate Add-On Request"
    runs-on: ubuntu-latest
    outputs:
      duplicate_detected: ${{ steps.validate.outputs.duplicate_detected }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-addon-deploy

      - name: Validate AWS credentials
        run: |
          set -euo pipefail
          echo "Validating AWS credentials..."
          aws sts get-caller-identity
          echo "Credentials valid."

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          terraform init -input=false

      - name: Load current state and check for duplicates
        id: validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ADDON_TYPE: ${{ github.event.inputs.addon_type }}
          CUSTOMER: ${{ github.event.inputs.customer_id }}
          ENV: ${{ github.event.inputs.environment }}
          OPERATION: ${{ github.event.inputs.operation }}
          DEPLOYMENT_PROFILE: ${{ github.event.inputs.deployment_profile }}
          EXTERNAL_CA_PROVIDER: ${{ github.event.inputs.external_ca_provider }}
        run: |
          set -euo pipefail

          echo "=== Add-On Validation ==="
          echo "Customer: $CUSTOMER"
          echo "Environment: $ENV"
          echo "Add-On Type: $ADDON_TYPE"
          echo "Operation: $OPERATION"
          echo "Deployment Profile: $DEPLOYMENT_PROFILE"

          echo "--- Checking for existing add-on resources ---"
          EXISTING=$(terraform state list 2>/dev/null | grep -i "addon_${ADDON_TYPE}" || true)

          if [ -n "$EXISTING" ] && [ "$OPERATION" = "deploy" ]; then
            echo "::warning::Existing add-on resources detected:"
            echo "$EXISTING"
            echo "::warning::Duplicate deployment detected. Set operation=plan to review or operation=remove to clean up."
            echo "duplicate_detected=true" >> "$GITHUB_OUTPUT"
          else
            echo "No duplicate add-on resources found."
            echo "duplicate_detected=false" >> "$GITHUB_OUTPUT"
          fi

          # Validate add-on specific requirements
          case "$ADDON_TYPE" in
            external_ca)
              if [ "$EXTERNAL_CA_PROVIDER" = "none" ]; then
                echo "::error::external_ca_provider must be specified when addon_type=external_ca"
                exit 1
              fi
              ;;
            scep|acme)
              echo "PKI add-on selected. Validating PKI prerequisites..."
              ;;
            monitoring)
              echo "Monitoring add-on selected."
              ;;
            additional_gateway|additional_worker)
              echo "Scaling add-on selected."
              ;;
          esac

          echo "Validation complete."

      - name: Upload validation state
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-state
          path: ${{ env.TF_WORKING_DIR }}/.terraform
          retention-days: 7

  # ============================================================================
  # JOB 2: PLAN
  # ============================================================================
  plan:
    name: "Terraform Plan"
    runs-on: ubuntu-latest
    needs: validate
    outputs:
      create_count: ${{ steps.guardrails.outputs.create_count }}
      update_count: ${{ steps.guardrails.outputs.update_count }}
      delete_count: ${{ steps.guardrails.outputs.delete_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-addon-plan

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${{ github.event.inputs.customer_id }}-tfstate" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_customer_id: ${{ github.event.inputs.customer_id }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
          TF_VAR_addon_type: ${{ github.event.inputs.addon_type }}
          TF_VAR_external_ca_provider: ${{ github.event.inputs.external_ca_provider }}
          TF_VAR_deployment_profile: ${{ github.event.inputs.deployment_profile }}
          TF_VAR_operation: ${{ github.event.inputs.operation }}
        run: |
          set -euo pipefail
          terraform plan \
            -target="module.addon_${TF_VAR_addon_type}" \
            -out=tfplan \
            -detailed-exitcode \
            -input=false
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Resource count and cost guardrails
        id: guardrails
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail

          PLAN_FILE="tfplan"
          MAX_RESOURCES=${{ env.MAX_RESOURCE_COUNT }}

          echo "=== Resource Count Check ==="
          if [ -f "$PLAN_FILE" ]; then
            terraform show -json "$PLAN_FILE" > plan.json 2>/dev/null || true

            if [ -f plan.json ]; then
              CREATE_COUNT=$(jq '[.resource_changes[] | select(.change.actions | contains(["create"]))] | length' plan.json)
              UPDATE_COUNT=$(jq '[.resource_changes[] | select(.change.actions | contains(["update"]))] | length' plan.json)
              DELETE_COUNT=$(jq '[.resource_changes[] | select(.change.actions | contains(["delete"]))] | length' plan.json)
              TOTAL_COUNT=$((CREATE_COUNT + UPDATE_COUNT + DELETE_COUNT))

              echo "Resources to create: $CREATE_COUNT"
              echo "Resources to update: $UPDATE_COUNT"
              echo "Resources to delete: $DELETE_COUNT"
              echo "Total changes: $TOTAL_COUNT"

              if [ "$TOTAL_COUNT" -gt "$MAX_RESOURCES" ]; then
                echo "::error::Resource count ($TOTAL_COUNT) exceeds guardrail limit ($MAX_RESOURCES)"
                exit 1
              fi

              echo "create_count=$CREATE_COUNT" >> "$GITHUB_OUTPUT"
              echo "update_count=$UPDATE_COUNT" >> "$GITHUB_OUTPUT"
              echo "delete_count=$DELETE_COUNT" >> "$GITHUB_OUTPUT"
            else
              echo "Warning: Could not parse plan JSON. Skipping detailed count."
            fi
          else
            echo "Warning: Plan file not found. Skipping resource count."
          fi

          echo "=== Cost Estimate (placeholder) ==="
          echo "Add-on type: ${{ github.event.inputs.addon_type }}"
          echo "Deployment profile: ${{ github.event.inputs.deployment_profile }}"
          echo "Estimated monthly cost: TBD (integrate Infracost or AWS Cost Explorer)"

      - name: Security review
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          echo "=== Security Review ==="
          echo "Reviewing planned changes for security concerns..."

          if [ -f plan.json ]; then
            OPEN_SG=$(jq '[.resource_changes[] | select(.type == "aws_security_group_rule") | select(.change.after.cidr_blocks[]? == "0.0.0.0/0")] | length' plan.json 2>/dev/null || echo "0")
            if [ "$OPEN_SG" -gt 0 ]; then
              echo "::warning::Found $OPEN_SG security group rules open to 0.0.0.0/0"
            fi
          fi

          echo "Security review complete."

      - name: Upload terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: ${{ env.TF_WORKING_DIR }}/tfplan
          retention-days: 7

  # ============================================================================
  # JOB 3: APPROVAL
  # ============================================================================
  approval:
    name: "Manual Approval"
    runs-on: ubuntu-latest
    needs: plan
    if: github.event.inputs.operation == 'deploy'
    environment:
      name: ${{ github.event.inputs.environment }}
    steps:
      - name: Approval checkpoint
        run: |
          echo "Manual approval required for deployment to ${{ github.event.inputs.environment }}."
          echo "Customer: ${{ github.event.inputs.customer_id }}"
          echo "Add-On Type: ${{ github.event.inputs.addon_type }}"
          echo "Deployment Profile: ${{ github.event.inputs.deployment_profile }}"

  # ============================================================================
  # JOB 4: DEPLOY_ADDON
  # ============================================================================
  deploy-addon:
    name: "Deploy Add-On"
    runs-on: ubuntu-latest
    needs: approval
    if: github.event.inputs.operation == 'deploy'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-addon-deploy

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.0"

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="bucket=${{ github.event.inputs.customer_id }}-tfstate" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply (Targeted)
        id: apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_customer_id: ${{ github.event.inputs.customer_id }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
          TF_VAR_addon_type: ${{ github.event.inputs.addon_type }}
          TF_VAR_external_ca_provider: ${{ github.event.inputs.external_ca_provider }}
          TF_VAR_deployment_profile: ${{ github.event.inputs.deployment_profile }}
          TF_VAR_operation: ${{ github.event.inputs.operation }}
        run: |
          set -euo pipefail
          terraform apply \
            -target="module.addon_${TF_VAR_addon_type}" \
            -auto-approve \
            -input=false

      - name: Argo CD Sync
        run: |
          set -euo pipefail
          echo "=== Argo CD Sync ==="
          echo "Syncing Argo CD application for add-on: ${{ github.event.inputs.addon_type }}"

          # Placeholder: Replace with actual Argo CD CLI or API call
          # argocd app sync "${{ github.event.inputs.customer_id }}-${{ github.event.inputs.environment }}-addon-${{ github.event.inputs.addon_type }}" \
          #   --server "$ARGOCD_SERVER" \
          #   --auth-token "$ARGOCD_TOKEN"

          echo "Argo CD sync initiated (placeholder)."

      - name: Configure add-on
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          ADDON_TYPE: ${{ github.event.inputs.addon_type }}
          CUSTOMER: ${{ github.event.inputs.customer_id }}
          ENV: ${{ github.event.inputs.environment }}
          EXTERNAL_CA_PROVIDER: ${{ github.event.inputs.external_ca_provider }}
        run: |
          set -euo pipefail
          echo "=== Configure Add-On ==="

          case "$ADDON_TYPE" in
            external_ca)
              echo "Configuring external CA integration..."
              echo "Provider: $EXTERNAL_CA_PROVIDER"
              # Add external CA configuration logic here
              ;;
            scep)
              echo "Configuring SCEP service..."
              # Add SCEP configuration logic here
              ;;
            acme)
              echo "Configuring ACME service..."
              # Add ACME configuration logic here
              ;;
            monitoring)
              echo "Configuring monitoring stack..."
              # Add monitoring configuration logic here
              ;;
            additional_gateway)
              echo "Configuring additional gateway..."
              # Add gateway configuration logic here
              ;;
            additional_worker)
              echo "Configuring additional worker..."
              # Add worker configuration logic here
              ;;
          esac

          echo "Add-on configuration complete."

      - name: Verify deployment
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          set -euo pipefail
          echo "=== Verify Deployment ==="

          terraform output -json > outputs.json 2>/dev/null || true

          if [ -f outputs.json ]; then
            echo "Terraform outputs:"
            cat outputs.json | jq '.' || cat outputs.json
          fi

          echo "Deployment verification complete."

  # ============================================================================
  # JOB 5: SMOKE_TESTS
  # ============================================================================
  smoke-tests:
    name: "Smoke Tests"
    runs-on: ubuntu-latest
    needs: deploy-addon
    if: github.event.inputs.operation == 'deploy'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-addon-smoke

      - name: Connectivity tests
        run: |
          set -euo pipefail
          echo "=== Connectivity Tests ==="
          echo "Testing connectivity for add-on: ${{ github.event.inputs.addon_type }}"

          # Add connectivity test logic here
          # Example: curl health endpoints, check DNS resolution, etc.

          echo "Connectivity tests passed."

      - name: Authentication tests
        run: |
          set -euo pipefail
          echo "=== Authentication Tests ==="
          echo "Testing authentication for add-on: ${{ github.event.inputs.addon_type }}"

          # Add auth test logic here

          echo "Authentication tests passed."

      - name: PKI tests
        env:
          ADDON_TYPE: ${{ github.event.inputs.addon_type }}
        run: |
          set -euo pipefail
          echo "=== PKI Tests ==="

          if [ "$ADDON_TYPE" = "external_ca" ] || [ "$ADDON_TYPE" = "scep" ] || [ "$ADDON_TYPE" = "acme" ]; then
            echo "Running PKI-specific tests for $ADDON_TYPE..."
            # Add PKI test logic here
          else
            echo "Skipping PKI tests (not applicable for $ADDON_TYPE)."
          fi

          echo "PKI tests passed."

      - name: Idempotency tests
        working-directory: ${{ env.TF_WORKING_DIR }}
        env:
          TF_VAR_customer_id: ${{ github.event.inputs.customer_id }}
          TF_VAR_environment: ${{ github.event.inputs.environment }}
          TF_VAR_addon_type: ${{ github.event.inputs.addon_type }}
          TF_VAR_external_ca_provider: ${{ github.event.inputs.external_ca_provider }}
          TF_VAR_deployment_profile: ${{ github.event.inputs.deployment_profile }}
          TF_VAR_operation: ${{ github.event.inputs.operation }}
        run: |
          set -euo pipefail
          echo "=== Idempotency Tests ==="
          echo "Verifying terraform plan shows no changes after apply..."

          terraform plan \
            -target="module.addon_${TF_VAR_addon_type}" \
            -detailed-exitcode \
            -input=false || EXIT_CODE=$?

          if [ "${EXIT_CODE:-0}" -eq 2 ]; then
            echo "::warning::Idempotency check: terraform plan shows pending changes"
          else
            echo "Idempotency check passed: no pending changes."
          fi

  # ============================================================================
  # JOB 6: REPORT
  # ============================================================================
  report:
    name: "Generate Report"
    runs-on: ubuntu-latest
    needs: [validate, plan, deploy-addon, smoke-tests]
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate report
        env:
          CUSTOMER_ID: ${{ github.event.inputs.customer_id }}
          ENVIRONMENT: ${{ github.event.inputs.environment }}
          ADDON_TYPE: ${{ github.event.inputs.addon_type }}
          DEPLOYMENT_PROFILE: ${{ github.event.inputs.deployment_profile }}
          OPERATION: ${{ github.event.inputs.operation }}
          EXTERNAL_CA_PROVIDER: ${{ github.event.inputs.external_ca_provider }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          APPROVAL_RESULT: ${{ needs.approval.result }}
          DEPLOY_RESULT: ${{ needs.deploy-addon.result }}
          SMOKE_RESULT: ${{ needs.smoke-tests.result }}
        run: |
          set -euo pipefail

          REPORT_FILE="addon-deployment-report.md"

          cat > "$REPORT_FILE" << EOF
          # Add-On Deployment Report

          ## Summary
          - **Customer ID:** ${CUSTOMER_ID}
          - **Environment:** ${ENVIRONMENT}
          - **Add-On Type:** ${ADDON_TYPE}
          - **Deployment Profile:** ${DEPLOYMENT_PROFILE}
          - **Operation:** ${OPERATION}
          - **External CA Provider:** ${EXTERNAL_CA_PROVIDER}
          - **Timestamp:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")

          ## Pipeline Results
          - **Run ID:** ${RUN_ID}
          - **Run Number:** ${RUN_NUMBER}
          - **Source Branch:** ${REF}
          - **Source Version:** ${SHA}

          ## Stage Results
          | Stage | Result |
          |-------|--------|
          | VALIDATE | ${VALIDATE_RESULT} |
          | PLAN | ${PLAN_RESULT} |
          | APPROVAL | ${APPROVAL_RESULT} |
          | DEPLOY_ADDON | ${DEPLOY_RESULT} |
          | SMOKE_TESTS | ${SMOKE_RESULT} |

          ## Notes
          - Duplicate detection: See VALIDATE stage logs
          - Resource counts: See PLAN stage logs
          - Security review: See PLAN stage logs
          EOF

          echo "Report generated: $REPORT_FILE"
          cat "$REPORT_FILE"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: addon-deployment-report.md
          retention-days: 30

      - name: Upload all artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: addon-deployment-results
          path: |
            addon-deployment-report.md
            ${{ env.TF_WORKING_DIR }}/tfplan
            ${{ env.TF_WORKING_DIR }}/plan.json
            ${{ env.TF_WORKING_DIR }}/outputs.json
          retention-days: 30
