name: PKI Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'apps/pki/**'
      - 'apps/openbao/**'
      - 'apps/spire/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/pki/**'
      - 'apps/openbao/**'
      - 'apps/spire/**'

jobs:
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: 'v1.28.0'
    
    - name: Validate Kubernetes manifests
      run: |
        find apps/pki -name "*.yaml" -type f | while read file; do
          echo "Validating $file"
          kubectl apply --dry-run=client -f "$file" || exit 1
        done
    
    - name: Validate Kustomize builds
      run: |
        cd apps/pki && kustomize build . > /dev/null || exit 1
    
    - name: Check for secrets in manifests
      run: |
        if grep -r "password:" apps/pki/ --include="*.yaml" | grep -v "password-change-me"; then
          echo "ERROR: Hardcoded passwords found in manifests"
          exit 1
        fi
        echo "No hardcoded passwords found"

  validate-policies:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate policy syntax
      run: |
        python3 -c "
        import yaml
        with open('apps/pki/cert-worker/configmap-policy.yaml') as f:
            config = yaml.safe_load(f)
            policies = config['data']['policies.yaml']
            policy_config = yaml.safe_load(policies)
            print(f'Validated {len(policy_config[\"policies\"])} policies')
        "
    
    - name: Validate PQC config
      run: |
        python3 -c "
        import yaml
        with open('apps/pki/cert-worker/configmap-pqc.yaml') as f:
            config = yaml.safe_load(f)
            pqc = yaml.safe_load(config['data']['pqc-policy.yaml'])
            print(f'Validated PQC policy with {len(pqc[\"policy\"][\"algorithms\"])} algorithm categories')
        "

  validate-dockerfiles:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Lint Dockerfiles
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: apps/pki/cert-api/Dockerfile
        ignore: DL3008,DL3013
    
    - name: Lint cert-worker Dockerfile
      uses: hadolint/hadolint-action@v3.1.0
      with:
        dockerfile: apps/pki/cert-worker/Dockerfile
        ignore: DL3008,DL3013

  validate-schema:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Validate SQL schema
      run: |
        # Check for basic SQL syntax
        grep -E "CREATE (TABLE|INDEX|VIEW)" apps/pki/shared/schema.sql > /dev/null || {
          echo "ERROR: No CREATE statements found in schema"
          exit 1
        }
        echo "SQL schema validation passed"
    
    - name: Validate Python syntax
      run: |
        python3 -m py_compile apps/pki/cert-api/main.py
        python3 -m py_compile apps/pki/cert-worker/main.py
        echo "Python syntax validation passed"
