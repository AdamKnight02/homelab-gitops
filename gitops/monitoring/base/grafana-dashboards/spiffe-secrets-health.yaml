apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dash-spiffe-secrets
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PKI Platform
data:
  spiffe-secrets.json: |
    {
      "uid": "pki-spiffe-secrets",
      "title": "SPIFFE / Secrets Health",
      "tags": ["pki", "spiffe", "spire", "openbao", "secrets"],
      "timezone": "browser",
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "panels": [
        {
          "id": 1, "type": "stat", "title": "SPIRE Server",
          "gridPos": {"h": 5, "w": 4, "x": 0, "y": 0},
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}]}},
          "targets": [{"expr": "max(up{app_kubernetes_io_name=\"spire-server\"})"}]
        },
        {
          "id": 2, "type": "stat", "title": "SPIRE Agents Ready",
          "gridPos": {"h": 5, "w": 4, "x": 4, "y": 0},
          "targets": [{"expr": "count(kube_pod_status_ready{namespace=\"spire\", condition=\"true\", pod=~\"spire-agent-.*\"})"}]
        },
        {
          "id": 3, "type": "stat", "title": "OpenBao Sealed",
          "gridPos": {"h": 5, "w": 4, "x": 8, "y": 0},
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "SEALED", "color": "red"}, "1": {"text": "UNSEALED", "color": "green"}}}]}},
          "targets": [{"expr": "max(vault_core_unsealed)"}]
        },
        {
          "id": 4, "type": "stat", "title": "OpenBao HA",
          "gridPos": {"h": 5, "w": 4, "x": 12, "y": 0},
          "targets": [{"expr": "count(vault_core_unsealed == 1)"}]
        },
        {
          "id": 5, "type": "stat", "title": "SVIDs Issued (1h)",
          "gridPos": {"h": 5, "w": 4, "x": 16, "y": 0},
          "targets": [{"expr": "sum(increase(spire_server_svid_issued_total[1h]))"}]
        },
        {
          "id": 6, "type": "stat", "title": "Secrets Expiring <30d",
          "gridPos": {"h": 5, "w": 4, "x": 20, "y": 0},
          "fieldConfig": {"defaults": {"thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 10}]}}},
          "targets": [{"expr": "sum(pki_secrets_expiring_within_days{days=\"30\"})"}]
        },
        {
          "id": 7, "type": "timeseries", "title": "SVID Issuance Rate",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "targets": [{"expr": "sum(rate(spire_server_svid_issued_total[5m])) by (trust_domain)", "legendFormat": "{{ trust_domain }}"}]
        },
        {
          "id": 8, "type": "timeseries", "title": "Agent Attestation Rate / Failures",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
          "targets": [
            {"expr": "sum(rate(spire_agent_attestation_total[5m]))", "legendFormat": "attestations"},
            {"expr": "sum(rate(spire_agent_attestation_failed_total[5m]))", "legendFormat": "failures"}
          ]
        },
        {
          "id": 9, "type": "timeseries", "title": "OpenBao Request Rate by Mount",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
          "targets": [{"expr": "sum(rate(vault_route_create_requests_total[5m])) by (mount)", "legendFormat": "create {{ mount }}"}]
        },
        {
          "id": 10, "type": "timeseries", "title": "OpenBao PKI Cert Issuance",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13},
          "targets": [{"expr": "sum(rate(vault_pki_issue_total[5m])) by (role)", "legendFormat": "{{ role }}"}]
        }
      ],
      "schemaVersion": 39,
      "version": 1
    }
