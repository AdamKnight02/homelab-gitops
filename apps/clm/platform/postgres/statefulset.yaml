apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clm-postgres
  namespace: clm
  labels:
    app.kubernetes.io/part-of: clm
spec:
  replicas: 1
  serviceName: clm-postgres-headless
  selector:
    matchLabels:
      app: clm-postgres
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app: clm-postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:18.6
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: clm
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clm-postgres-auth
                  key: postgres-password
            - name: CLM_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clm-postgres-auth
                  key: migrator-password
            - name: CLM_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clm-postgres-auth
                  key: app-password
            - name: EJBCA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clm-postgres-auth
                  key: ejbca-password
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
          ports:
            - name: postgres
              containerPort: 5432
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U postgres -d clm"]
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "pg_isready -U postgres -d clm"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: init
          configMap:
            name: clm-postgres-init
            defaultMode: 493
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 20Gi
