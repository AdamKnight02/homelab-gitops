apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: spire
  labels:
    app: spire-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spire-server
  serviceName: spire-server
  template:
    metadata:
      labels:
        app: spire-server
    spec:
      serviceAccountName: spire-server
      containers:
      - name: spire-server
        image: ghcr.io/spiffe/spire-server:1.10.0
        imagePullPolicy: IfNotPresent
        args:
        - -config
        - /run/spire/config/server.conf
        ports:
        - containerPort: 8081
          protocol: TCP
        livenessProbe:
          exec:
            command:
            - /opt/spire/bin/spire-server
            - healthcheck
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - /opt/spire/bin/spire-server
            - healthcheck
            - --shallow
          initialDelaySeconds: 5
          periodSeconds: 5
        volumeMounts:
        - name: spire-config
          mountPath: /run/spire/config
          readOnly: true
        - name: spire-data
          mountPath: /run/spire/data
        - name: spire-socket
          mountPath: /run/spire/sockets
      volumes:
      - name: spire-config
        configMap:
          name: spire-server
      - name: spire-socket
        emptyDir:
          medium: Memory
  volumeClaimTemplates:
  - metadata:
      name: spire-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: local-path
