apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dash-infrastructure-capacity
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: PKI Platform
data:
  infrastructure-capacity.json: |
    {
      "uid": "pki-infra-capacity",
      "title": "Infrastructure Capacity",
      "tags": ["pki", "infrastructure", "capacity", "nodes"],
      "timezone": "browser",
      "refresh": "1m",
      "time": {"from": "now-24h", "to": "now"},
      "panels": [
        {
          "id": 1, "type": "stat", "title": "Nodes Ready",
          "gridPos": {"h": 5, "w": 4, "x": 0, "y": 0},
          "targets": [{"expr": "count(kube_node_status_condition{condition=\"Ready\", status=\"true\"})"}]
        },
        {
          "id": 2, "type": "stat", "title": "Cluster CPU Allocatable",
          "gridPos": {"h": 5, "w": 4, "x": 4, "y": 0},
          "fieldConfig": {"defaults": {"unit": "cores"}},
          "targets": [{"expr": "sum(kube_node_status_allocatable{resource=\"cpu\"})"}]
        },
        {
          "id": 3, "type": "stat", "title": "Cluster Mem Allocatable",
          "gridPos": {"h": 5, "w": 4, "x": 8, "y": 0},
          "fieldConfig": {"defaults": {"unit": "bytes"}},
          "targets": [{"expr": "sum(kube_node_status_allocatable{resource=\"memory\"})"}]
        },
        {
          "id": 4, "type": "stat", "title": "CPU Saturation",
          "gridPos": {"h": 5, "w": 4, "x": 12, "y": 0},
          "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.7}, {"color": "red", "value": 0.9}]}}},
          "targets": [{"expr": "sum(rate(node_cpu_seconds_total{mode!=\"idle\"}[5m])) / sum(kube_node_status_allocatable{resource=\"cpu\"})"}]
        },
        {
          "id": 5, "type": "stat", "title": "Mem Saturation",
          "gridPos": {"h": 5, "w": 4, "x": 16, "y": 0},
          "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.75}, {"color": "red", "value": 0.9}]}}},
          "targets": [{"expr": "1 - sum(node_memory_MemAvailable_bytes) / sum(node_memory_MemTotal_bytes)"}]
        },
        {
          "id": 6, "type": "stat", "title": "Prometheus TSDB Free",
          "gridPos": {"h": 5, "w": 4, "x": 20, "y": 0},
          "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"steps": [{"color": "red", "value": null}, {"color": "yellow", "value": 0.15}, {"color": "green", "value": 0.3}]}}},
          "targets": [{"expr": "min(kubelet_volume_stats_available_bytes{namespace=\"monitoring\", persistentvolumeclaim=~\"prometheus-.*\"} / kubelet_volume_stats_capacity_bytes)"}]
        },
        {
          "id": 7, "type": "timeseries", "title": "Node CPU Usage",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 5},
          "fieldConfig": {"defaults": {"unit": "percentunit"}},
          "targets": [{"expr": "1 - avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) by (instance)", "legendFormat": "{{ instance }}"}]
        },
        {
          "id": 8, "type": "timeseries", "title": "Node Memory Usage",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 5},
          "fieldConfig": {"defaults": {"unit": "percentunit"}},
          "targets": [{"expr": "1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)", "legendFormat": "{{ instance }}"}]
        },
        {
          "id": 9, "type": "timeseries", "title": "Disk Usage by Node",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 13},
          "fieldConfig": {"defaults": {"unit": "percentunit", "thresholds": {"steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.8}, {"color": "red", "value": 0.9}]}}},
          "targets": [{"expr": "1 - node_filesystem_avail_bytes{mountpoint=\"/\", fstype!~\"tmpfs|overlay\"} / node_filesystem_size_bytes", "legendFormat": "{{ instance }}"}]
        },
        {
          "id": 10, "type": "timeseries", "title": "Network I/O by Node",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 13},
          "fieldConfig": {"defaults": {"unit": "Bps"}},
          "targets": [
            {"expr": "sum(rate(node_network_receive_bytes_total{device!~\"lo|veth.*\"}[5m])) by (instance)", "legendFormat": "{{ instance }} rx"},
            {"expr": "sum(rate(node_network_transmit_bytes_total{device!~\"lo|veth.*\"}[5m])) by (instance)", "legendFormat": "{{ instance }} tx"}
          ]
        },
        {
          "id": 11, "type": "timeseries", "title": "Prometheus Ingestion & Head Series",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 21},
          "targets": [
            {"expr": "sum(rate(prometheus_tsdb_head_samples_appended_total[5m]))", "legendFormat": "samples/s"},
            {"expr": "prometheus_tsdb_head_series", "legendFormat": "head series"}
          ]
        }
      ],
      "schemaVersion": 39,
      "version": 1
    }
