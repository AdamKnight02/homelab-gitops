apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-api-egress
  namespace: pki
  labels:
    app: cert-api
spec:
  podSelector:
    matchLabels:
      app: cert-api
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: pki-database
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/part-of: machine-identity-platform
    ports:
    - protocol: TCP
      port: 8000
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: spire
    ports:
    - protocol: TCP
      port: 8081
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openbao
    ports:
    - protocol: TCP
      port: 8200
