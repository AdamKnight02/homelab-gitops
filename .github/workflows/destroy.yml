name: Destroy Customer Environment

on:
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: 'Cloud provider'
        required: true
        type: choice
        options:
          - azure
          - aws
      customer_name:
        description: 'Customer name (must match the workspace to destroy)'
        required: true
        type: string
      environment:
        description: 'Environment to destroy'
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
      tfvars_file:
        description: 'Path to tfvars file (relative to provider dir)'
        required: false
        type: string
        default: 'terraform.tfvars'
      confirm_destroy:
        description: 'Type "DESTROY" to confirm teardown'
        required: true
        type: string

env:
  TF_VERSION: '1.9.8'

permissions:
  id-token: write
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # Confirmation Gate
  # ──────────────────────────────────────────────
  confirm:
    name: "⚠️ Confirm Destruction"
    runs-on: ubuntu-latest
    steps:
      - name: Validate Confirmation
        run: |
          if [ "${{ inputs.confirm_destroy }}" != "DESTROY" ]; then
            echo "::error::You must type 'DESTROY' to confirm environment teardown."
            echo "::error::Received: '${{ inputs.confirm_destroy }}'"
            exit 1
          fi
          echo "✅ Destruction confirmed by ${{ github.actor }}"

      - name: Safety Check — Production Warning
        if: inputs.environment == 'production'
        run: |
          echo "::warning::⚠️  You are about to destroy a PRODUCTION environment!"
          echo "::warning::Customer: ${{ inputs.customer_name }}"
          echo "::warning::This action is IRREVERSIBLE."

      - name: Record Intent
        run: |
          echo "## Destruction Request" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Requested By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Customer | ${{ inputs.customer_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Provider | ${{ inputs.cloud_provider }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Confirmation | ${{ inputs.confirm_destroy }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # Approval Gate (always required for destroy)
  # ──────────────────────────────────────────────
  approval:
    name: "🔐 Destruction Approval"
    runs-on: ubuntu-latest
    needs: [confirm]
    environment:
      name: ${{ inputs.environment }}
    steps:
      - name: Approval Granted
        run: |
          echo "Destruction approved by ${{ github.actor }}"
          echo "## Destruction Approved" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Approved by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Customer:** ${{ inputs.customer_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # Pre-Destroy: Verify Ownership & Backup State
  # ──────────────────────────────────────────────
  pre-destroy:
    name: "🔍 Pre-Destroy Checks"
    runs-on: ubuntu-latest
    needs: [approval]
    env:
      TF_DIR: infra/terraform/${{ inputs.cloud_provider }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        if: inputs.cloud_provider == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: AWS Credentials
        if: inputs.cloud_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Verify Workspace Exists
        working-directory: ${{ env.TF_DIR }}
        run: |
          WORKSPACE="${{ inputs.customer_name }}-${{ inputs.environment }}"
          
          # Check if the customer workspace exists
          if terraform workspace list | grep -q "^[* ] ${WORKSPACE}$"; then
            echo "✅ Workspace '$WORKSPACE' exists"
            terraform workspace select "$WORKSPACE"
          elif [ "$WORKSPACE" != "default" ] && terraform workspace list | grep -q "^[* ] default$"; then
            echo "::warning::Workspace '$WORKSPACE' does not exist, but 'default' workspace does"
            echo "::warning::Checking if 'default' workspace contains resources for this customer/environment..."
            terraform workspace select default
            
            # Check if default workspace has resources matching our tags
            RESOURCE_COUNT=$(terraform state list 2>/dev/null | wc -l)
            if [ "$RESOURCE_COUNT" -gt 0 ]; then
              echo "::warning::Default workspace contains $RESOURCE_COUNT resources"
              echo "::warning::Proceeding with destroy from default workspace"
              echo "WORKSPACE=default" >> $GITHUB_ENV
            else
              echo "::error::Workspace '$WORKSPACE' does not exist and default workspace is empty!"
              echo "::error::Available workspaces:"
              terraform workspace list
              exit 1
            fi
          else
            echo "::error::Workspace '$WORKSPACE' does not exist!"
            echo "::error::Available workspaces:"
            terraform workspace list
            exit 1
          fi

      - name: Verify State Has Resources
        working-directory: ${{ env.TF_DIR }}
        run: |
          WORKSPACE="${{ inputs.customer_name }}-${{ inputs.environment }}"
          if [ "${{ env.WORKSPACE }}" = "default" ]; then
            WORKSPACE="default"
          fi
          terraform workspace select "$WORKSPACE" 2>/dev/null || true
          
          RESOURCE_COUNT=$(terraform state list 2>/dev/null | wc -l)
          if [ "$RESOURCE_COUNT" -eq 0 ]; then
            echo "::warning::No resources found in Terraform state for workspace '$WORKSPACE'"
            echo "This may indicate:"
            echo "  1. Resources were already destroyed"
            echo "  2. State file is corrupted or out of sync"
            echo "  3. Wrong workspace selected"
            echo ""
            echo "Proceeding with destroy to clean up any orphaned resources..."
          else
            echo "✅ Found $RESOURCE_COUNT resources in state:"
            terraform state list
          fi

      - name: Verify Resource Ownership (Azure)
        if: inputs.cloud_provider == 'azure'
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "Verifying Azure resource ownership..."
          
          # Get resource group name from state or construct it
          RG_NAME=$(terraform state list 2>/dev/null | grep azurerm_resource_group | head -1 | cut -d. -f2 || echo "")
          
          if [ -n "$RG_NAME" ]; then
            RG_FULL_NAME=$(terraform state show "azurerm_resource_group.$RG_NAME" 2>/dev/null | grep " name " | head -1 | awk '{print $3}' | tr -d '"' || echo "")
            
            if [ -n "$RG_FULL_NAME" ]; then
              echo "Checking resource group: $RG_FULL_NAME"
              
              # Verify tags
              TAGS=$(az group show --name "$RG_FULL_NAME" --query "tags" -o json 2>/dev/null || echo "{}")
              MANAGED_BY=$(echo "$TAGS" | jq -r '.managed_by // "unknown"')
              PROJECT=$(echo "$TAGS" | jq -r '.project // "unknown"')
              
              echo "  managed_by: $MANAGED_BY"
              echo "  project: $PROJECT"
              
              if [ "$MANAGED_BY" != "terraform" ]; then
                echo "::error::Resource group '$RG_FULL_NAME' is not managed by Terraform (managed_by=$MANAGED_BY)"
                echo "::error::Refusing to destroy resources without ownership evidence"
                exit 1
              fi
              
              echo "✅ Ownership verified: Resource group is managed by Terraform"
            fi
          else
            echo "::warning::No resource group found in state, skipping ownership verification"
          fi

      - name: Verify Resource Ownership (AWS)
        if: inputs.cloud_provider == 'aws'
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "Verifying AWS resource ownership..."
          
          # Get VPC ID from state
          VPC_ID=$(terraform state show aws_vpc.main 2>/dev/null | grep " id " | head -1 | awk '{print $3}' | tr -d '"' || echo "")
          
          if [ -n "$VPC_ID" ] && [ "$VPC_ID" != "null" ]; then
            echo "Checking VPC: $VPC_ID"
            
            # Verify tags
            TAGS=$(aws ec2 describe-vpcs --vpc-ids "$VPC_ID" --query "Vpcs[0].Tags" -o json 2>/dev/null || echo "[]")
            MANAGED_BY=$(echo "$TAGS" | jq -r '.[] | select(.Key=="managed_by") | .Value // "unknown"')
            PROJECT=$(echo "$TAGS" | jq -r '.[] | select(.Key=="project") | .Value // "unknown"')
            
            echo "  managed_by: $MANAGED_BY"
            echo "  project: $PROJECT"
            
            if [ "$MANAGED_BY" != "terraform" ]; then
              echo "::error::VPC '$VPC_ID' is not managed by Terraform (managed_by=$MANAGED_BY)"
              echo "::error::Refusing to destroy resources without ownership evidence"
              exit 1
            fi
            
            echo "✅ Ownership verified: VPC is managed by Terraform"
          else
            echo "::warning::No VPC found in state, skipping ownership verification"
          fi

      - name: Backup State and Outputs
        working-directory: ${{ env.TF_DIR }}
        run: |
          echo "Backing up Terraform state and outputs before destruction..."

          # Save outputs
          terraform output -json > /tmp/pre_destroy_outputs.json 2>/dev/null || echo "{}" > /tmp/pre_destroy_outputs.json

          # Save state list
          terraform state list > /tmp/pre_destroy_state_list.txt 2>/dev/null || echo "No state" > /tmp/pre_destroy_state_list.txt

          # Save full state pull
          terraform state pull > /tmp/pre_destroy_state.json 2>/dev/null || echo "{}" > /tmp/pre_destroy_state.json

          echo "State backup complete"
          echo "Resources in state:"
          cat /tmp/pre_destroy_state_list.txt

      - name: Upload State Backup
        uses: actions/upload-artifact@v4
        with:
          name: state-backup-${{ inputs.cloud_provider }}-${{ inputs.customer_name }}-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            /tmp/pre_destroy_outputs.json
            /tmp/pre_destroy_state_list.txt
            /tmp/pre_destroy_state.json
          retention-days: 90

  # ──────────────────────────────────────────────
  # Destroy
  # ──────────────────────────────────────────────
  destroy:
    name: "💥 Destroy (${{ inputs.cloud_provider }} / ${{ inputs.customer_name }})"
    runs-on: ubuntu-latest
    needs: [pre-destroy]
    env:
      TF_DIR: infra/terraform/${{ inputs.cloud_provider }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Azure Login
        if: inputs.cloud_provider == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: AWS Credentials
        if: inputs.cloud_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Select Workspace
        working-directory: ${{ env.TF_DIR }}
        run: |
          WORKSPACE="${{ inputs.customer_name }}-${{ inputs.environment }}"
          if [ "${{ env.WORKSPACE }}" = "default" ]; then
            WORKSPACE="default"
          fi
          terraform workspace select "$WORKSPACE"

      - name: Terraform Destroy
        id: destroy
        working-directory: ${{ env.TF_DIR }}
        run: |
          TFVARS_ARG=""
          if [ -f "${{ inputs.tfvars_file }}" ]; then
            TFVARS_ARG="-var-file=${{ inputs.tfvars_file }}"
          fi

          terraform destroy \
            -input=false \
            -no-color \
            -auto-approve \
            $TFVARS_ARG \
            2>&1 | tee destroy_output.txt

          EXITCODE=${PIPESTATUS[0]}
          if [ $EXITCODE -ne 0 ]; then
            echo "::error::Terraform destroy failed with exit code $EXITCODE"
            exit $EXITCODE
          fi
          echo "✅ Terraform destroy completed"

      - name: Upload Destroy Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: destroy-log-${{ inputs.cloud_provider }}-${{ inputs.customer_name }}-${{ inputs.environment }}
          path: ${{ env.TF_DIR }}/destroy_output.txt
          retention-days: 90
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # Post-Destroy: Verify Zero Resources
  # ──────────────────────────────────────────────
  post-destroy-verify:
    name: "✅ Post-Destroy Verification"
    runs-on: ubuntu-latest
    needs: [destroy]
    if: needs.destroy.result == 'success'
    env:
      TF_DIR: infra/terraform/${{ inputs.cloud_provider }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        if: inputs.cloud_provider == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: AWS Credentials
        if: inputs.cloud_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Verify Terraform State Empty
        working-directory: ${{ env.TF_DIR }}
        run: |
          WORKSPACE="${{ inputs.customer_name }}-${{ inputs.environment }}"
          if [ "${{ env.WORKSPACE }}" = "default" ]; then
            WORKSPACE="default"
          fi
          terraform workspace select "$WORKSPACE" 2>/dev/null || true
          
          REMAINING=$(terraform state list 2>/dev/null | wc -l)
          if [ "$REMAINING" -gt 0 ]; then
            echo "::error::Terraform state still contains $REMAINING resources after destroy:"
            terraform state list
            exit 1
          fi
          echo "✅ Terraform state is empty"

      - name: Verify Azure Resources Destroyed
        if: inputs.cloud_provider == 'azure'
        run: |
          echo "Verifying Azure resources are destroyed..."
          
          # Check for resource groups with pki-lab pattern
          RG_COUNT=$(az group list --query "[?contains(name, '${{ inputs.customer_name }}') && contains(name, '${{ inputs.environment }}')]" -o json | jq length)
          
          if [ "$RG_COUNT" -gt 0 ]; then
            echo "::error::Found $RG_COUNT resource groups still existing:"
            az group list --query "[?contains(name, '${{ inputs.customer_name }}') && contains(name, '${{ inputs.environment }}')]" -o table
            exit 1
          fi
          
          # Check for soft-deleted Key Vaults
          echo "Checking for soft-deleted Key Vaults..."
          SOFT_DELETED_KVS=$(az keyvault list-deleted --query "[?contains(name, '${{ inputs.customer_name }}')]" -o json | jq length)
          
          if [ "$SOFT_DELETED_KVS" -gt 0 ]; then
            echo "::warning::Found $SOFT_DELETED_KVS soft-deleted Key Vaults that may need purging:"
            az keyvault list-deleted --query "[?contains(name, '${{ inputs.customer_name }}')]" -o table
            echo "::warning::Run 'az keyvault purge --name <name>' to permanently delete them"
          fi
          
          echo "✅ Azure verification complete: $RG_COUNT resource groups remaining"

      - name: Verify AWS Resources Destroyed
        if: inputs.cloud_provider == 'aws'
        run: |
          echo "Verifying AWS resources are destroyed..."
          
          # Check for EC2 instances
          INSTANCE_COUNT=$(aws ec2 describe-instances --filters "Name=tag:project,Values=${{ inputs.customer_name }}" "Name=tag:environment,Values=${{ inputs.environment }}" "Name=instance-state-name,Values=running,pending,stopping,stopped" --query "Reservations[*].Instances[*].InstanceId" --output json | jq 'flatten | length')
          
          if [ "$INSTANCE_COUNT" -gt 0 ]; then
            echo "::error::Found $INSTANCE_COUNT EC2 instances still running:"
            aws ec2 describe-instances --filters "Name=tag:project,Values=${{ inputs.customer_name }}" "Name=tag:environment,Values=${{ inputs.environment }}" --query "Reservations[*].Instances[*].[InstanceId,State.Name,Tags[?Key=='Name'].Value|[0]]" --output table
            exit 1
          fi
          
          # Check for VPCs
          VPC_COUNT=$(aws ec2 describe-vpcs --filters "Name=tag:project,Values=${{ inputs.customer_name }}" "Name=tag:environment,Values=${{ inputs.environment }}" --query "Vpcs[*].VpcId" --output json | jq length)
          
          if [ "$VPC_COUNT" -gt 0 ]; then
            echo "::error::Found $VPC_COUNT VPCs still existing:"
            aws ec2 describe-vpcs --filters "Name=tag:project,Values=${{ inputs.customer_name }}" "Name=tag:environment,Values=${{ inputs.environment }}" --query "Vpcs[*].[VpcId,Tags[?Key=='Name'].Value|[0]]" --output table
            exit 1
          fi
          
          # Check for IAM roles
          ROLE_COUNT=$(aws iam list-roles --query "Roles[?contains(RoleName, '${{ inputs.customer_name }}') && contains(RoleName, '${{ inputs.environment }}')]" --output json | jq length)
          
          if [ "$ROLE_COUNT" -gt 0 ]; then
            echo "::warning::Found $ROLE_COUNT IAM roles still existing:"
            aws iam list-roles --query "Roles[?contains(RoleName, '${{ inputs.customer_name }}') && contains(RoleName, '${{ inputs.environment }}')].[RoleName,Arn]" --output table
          fi
          
          echo "✅ AWS verification complete: $INSTANCE_COUNT instances, $VPC_COUNT VPCs, $ROLE_COUNT IAM roles remaining"

      - name: Generate Verification Report
        run: |
          echo "## Post-Destroy Verification Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Terraform State Empty | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Cloud Resources Destroyed | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Verification completed at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  # Post-Destroy: Cleanup Workspace
  # ──────────────────────────────────────────────
  cleanup:
    name: "🧹 Cleanup"
    runs-on: ubuntu-latest
    needs: [post-destroy-verify]
    if: needs.post-destroy-verify.result == 'success'
    env:
      TF_DIR: infra/terraform/${{ inputs.cloud_provider }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Azure Login
        if: inputs.cloud_provider == 'azure'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: AWS Credentials
        if: inputs.cloud_provider == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false

      - name: Delete Workspace
        working-directory: ${{ env.TF_DIR }}
        run: |
          WORKSPACE="${{ inputs.customer_name }}-${{ inputs.environment }}"
          if [ "${{ env.WORKSPACE }}" = "default" ]; then
            echo "Skipping workspace deletion for default workspace"
            exit 0
          fi

          # Switch to default first
          terraform workspace select default

          # Delete the customer workspace
          terraform workspace delete "$WORKSPACE" || echo "::warning::Could not delete workspace $WORKSPACE"

          echo "Workspace cleanup complete"

      - name: Verify Workspace Deleted
        working-directory: ${{ env.TF_DIR }}
        run: |
          WORKSPACE="${{ inputs.customer_name }}-${{ inputs.environment }}"
          if [ "${{ env.WORKSPACE }}" = "default" ]; then
            echo "Skipping workspace deletion verification for default workspace"
            exit 0
          fi
          
          if terraform workspace list | grep -q "^[* ] ${WORKSPACE}$"; then
            echo "::error::Workspace '$WORKSPACE' still exists after deletion attempt"
            exit 1
          fi
          
          echo "✅ Workspace '$WORKSPACE' successfully deleted"

  # ──────────────────────────────────────────────
  # Final Summary
  # ──────────────────────────────────────────────
  destroy-summary:
    name: "📋 Destruction Summary"
    runs-on: ubuntu-latest
    needs: [confirm, approval, pre-destroy, destroy, post-destroy-verify, cleanup]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "# Environment Destruction Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Customer | **${{ inputs.customer_name }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | **${{ inputs.environment }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Cloud Provider | **${{ inputs.cloud_provider }}** |" >> $GITHUB_STEP_SUMMARY
          echo "| Destroyed By | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Timestamp | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Stages" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Confirmation | ${{ needs.confirm.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Approval | ${{ needs.approval.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-Destroy Checks | ${{ needs.pre-destroy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Destroy | ${{ needs.destroy.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Post-Destroy Verification | ${{ needs.post-destroy-verify.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Cleanup | ${{ needs.cleanup.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.destroy.result }}" = "success" ] && [ "${{ needs.post-destroy-verify.result }}" = "success" ]; then
            echo "**Result:** 💥 Environment **${{ inputs.customer_name }}-${{ inputs.environment }}** has been destroyed and verified." >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.destroy.result }}" = "success" ]; then
            echo "**Result:** ⚠️ Environment destroyed but verification failed. Manual cleanup may be required." >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "**Result:** ❌ Destruction failed. Review logs for details." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
