# Default-deny; state-api may only:
#   - receive traffic from state-ui and prometheus (monitoring ns)
#   - reach cloud provider endpoints (443) and the K8s API (TokenReview)
#   - resolve DNS
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: state-api
  namespace: state-system
  labels:
    app.kubernetes.io/name: state-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: state-api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: state-ui
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API (TokenReview)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 6443
          protocol: TCP
        - port: 443
          protocol: TCP
