apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-allow-pki
  namespace: openbao
  labels:
    app.kubernetes.io/name: openbao
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openbao
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: pki
    ports:
    - protocol: TCP
      port: 8200
