apiVersion: v1
kind: Service
metadata:
  name: clm-rabbitmq
  namespace: clm
  labels:
    app.kubernetes.io/part-of: clm
spec:
  type: ClusterIP
  selector:
    app: clm-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
---
apiVersion: v1
kind: Service
metadata:
  name: clm-rabbitmq-headless
  namespace: clm
  labels:
    app.kubernetes.io/part-of: clm
spec:
  clusterIP: None
  selector:
    app: clm-rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
