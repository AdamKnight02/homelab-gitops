version: "1.0"
generated: "2026-09-12"

# -----------------------------------------------------------------------------
# Test Scenarios
# -----------------------------------------------------------------------------
scenarios:

  # --- Baseline ---
  - id: "EXTCA-NONE"
    name: "No External CA (Internal Only)"
    description: "Platform operates with internal CA only, no external integration"
    provider: null
    integration_type: none
    expected_result: "PASS"
    requires:
      credentials: false
      network: false
      cluster: true
    test_steps:
      - "Verify EJBCA is running with internal CAs"
      - "Verify no external CA configuration exists"
      - "Verify certificate issuance works via internal CA"
    status: "implemented"

  # --- Let's Encrypt ---
  - id: "EXTCA-LE-PROD"
    name: "Let's Encrypt Production"
    description: "ACME integration with Let's Encrypt production directory"
    provider: letsencrypt
    integration_type: acme
    directory_url: "https://acme-v02.api.letsencrypt.org/directory"
    expected_result: "BLOCKED"
    requires:
      credentials: false
      network: true
      cluster: true
      public_dns: true
    test_steps:
      - "Configure ACME account with Let's Encrypt production"
      - "Request certificate via HTTP-01 challenge"
      - "Verify certificate issuance"
      - "Verify certificate chain (ISRG Root X1)"
      - "Test renewal"
      - "Test revocation"
    rate_limits:
      certificates_per_domain_per_week: 50
      duplicate_certificates_per_week: 5
      failed_validations_per_account_per_hour: 5
    notes: "Requires public DNS and HTTP-01/DNS-01 challenge capability"
    status: "blocked"

  - id: "EXTCA-LE-STAGING"
    name: "Let's Encrypt Staging"
    description: "ACME integration with Let's Encrypt staging directory"
    provider: letsencrypt-staging
    integration_type: acme
    directory_url: "https://acme-staging-v02.api.letsencrypt.org/directory"
    expected_result: "BLOCKED"
    requires:
      credentials: false
      network: true
      cluster: true
      public_dns: false
    test_steps:
      - "Configure ACME account with Let's Encrypt staging"
      - "Request certificate via HTTP-01 challenge"
      - "Verify certificate issuance (fake certs)"
      - "Test renewal"
      - "Test revocation"
    notes: "Safe for testing — no rate limits, issues fake certs"
    status: "blocked"

  # --- DigiCert ---
  - id: "EXTCA-DIGICERT"
    name: "DigiCert CertCentral"
    description: "REST API integration with DigiCert CertCentral"
    provider: digicert
    integration_type: anyca
    endpoint: "https://www.digicert.com/services/v2"
    expected_result: "BLOCKED"
    requires:
      credentials: true
      network: true
      cluster: true
    credential_refs:
      api_key: "openbao:pki/digicert/api-key"
      account_id: "openbao:pki/digicert/account-id"
    test_steps:
      - "Configure DigiCert API credentials"
      - "Submit certificate request"
      - "Verify request approval"
      - "Retrieve issued certificate"
      - "Verify certificate chain"
      - "Test renewal"
      - "Test revocation"
      - "Test certificate discovery"
      - "Test inventory sync"
    capabilities:
      issue: true
      renew: true
      revoke: true
      discover: true
      inventory: true
    notes: "Requires DigiCert API key and account"
    status: "blocked"

