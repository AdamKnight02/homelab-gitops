# Argo CD Application for state-api.
# Follows the homelab-gitops multi-source convention (see apps/openbao).
# Default path is the base (no cloud identity overlay); provider overlays are
# selected via ApplicationSet or by changing `path`.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: state-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: state-api
    app.kubernetes.io/part-of: pki-platform
spec:
  project: default

  source:
    repoURL: https://github.com/AdamKnight02/homelab-gitops.git
    targetRevision: main
    path: gitops/state-api/base

  destination:
    server: https://kubernetes.default.svc
    namespace: state-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  revisionHistoryLimit: 5
