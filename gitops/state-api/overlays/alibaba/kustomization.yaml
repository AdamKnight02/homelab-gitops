# Alibaba overlay — RRSA for state-api.
# Requires: RAM role with oss:GetObject/HeadObject on the state bucket,
# tablestore:GetRow on the lock table, oss:PutObject on backups/* only,
# bound via RRSA to this service account.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: state-system

resources:
  - ../../base

patches:
  - patch: |
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: state-api
        namespace: state-system
        annotations:
          alibabacloud.com/role-arn: "${ALIBABA_STATE_API_ROLE_ARN}"
    target:
      kind: ServiceAccount
      name: state-api
  - patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: state-api
        namespace: state-system
      spec:
        template:
          metadata:
            labels:
              alibabacloud.com/enable-rrsa: "true"
    target:
      kind: Deployment
      name: state-api
