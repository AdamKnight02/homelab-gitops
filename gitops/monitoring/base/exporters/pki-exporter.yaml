# PKI Exporter — lightweight custom collector for PKI platform metrics.
# This exporter bridges gaps where applications do not natively expose
# Prometheus metrics. It queries EJBCA, OpenBao, SPIRE, and other PKI
# components and exposes derived metrics for Prometheus scraping.
#
# Design principles:
#   - Stateless collector; no persistent storage required
#   - Queries component APIs directly (EJBCA REST, OpenBao sys/metrics, etc.)
#   - Exposes metrics on :9102/metrics for Prometheus scraping
#   - Runs as a Deployment in the monitoring namespace
#   - ServiceMonitor selects it via monitoring.pki.platform.io/enabled label
#
# Metrics exposed (see docs/monitoring/pki-metrics.md for full catalog):
#   - pki_ejbca_ca_status, pki_ejbca_certificates_issued_total, ...
#   - pki_openbao_seal_state, pki_openbao_availability
#   - pki_spire_server_up, pki_spire_svid_expiration_seconds
#   - pki_certificates_expiring_within_days (derived from cert-manager + EJBCA)
#   - pki_external_ca_gateway_up, pki_external_ca_api_reachable
#
# The exporter is intentionally simple: it shells out to curl/jq or uses
# small Python scripts to query APIs and format Prometheus text exposition.
# For production, replace with a proper exporter binary (e.g., written in Go).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: pki-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pki-exporter
    app.kubernetes.io/part-of: machine-identity-platform
    component: exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pki-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pki-exporter
        app.kubernetes.io/part-of: machine-identity-platform
        component: exporter
    spec:
      serviceAccountName: pki-exporter
      containers:
        - name: pki-exporter
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python3", "/exporter/exporter.py"]
          ports:
            - name: metrics
              containerPort: 9102
              protocol: TCP
          env:
            - name: EJBCA_BASE_URL
              value: "http://ejbca-ejbca-ce.ejbca.svc:8080/ejbca"
            - name: OPENBAO_ADDR
              value: "https://openbao.openbao.svc:8200"
            - name: SPIRE_SERVER_ADDR
              value: "spire-server.spire.svc:8081"
            - name: POSTGRES_HOST
              value: "postgres-postgresql.postgres.svc"
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: "ejbcadb"
            - name: POSTGRES_USER
              value: "ejbca"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-postgresql
                  key: password
            - name: EXPORTER_PORT
              value: "9102"
            - name: EXPORTER_INTERVAL
              value: "30"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: exporter-script
              mountPath: /exporter
              readOnly: true
      volumes:
        - name: exporter-script
          configMap:
            name: pki-exporter-script
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: pki-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pki-exporter
    app.kubernetes.io/part-of: machine-identity-platform
    component: exporter
    monitoring.pki.platform.io/enabled: "true"
spec:
  selector:
    app.kubernetes.io/name: pki-exporter
  ports:
    - name: metrics
      port: 9102
      targetPort: metrics
      protocol: TCP
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pki-exporter
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pki-exporter
    app.kubernetes.io/part-of: machine-identity-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pki-exporter
  labels:
    app.kubernetes.io/name: pki-exporter
    app.kubernetes.io/part-of: machine-identity-platform
rules:
  # Read cert-manager certificates for expiry derivation
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "certificaterequests", "clusterissuers", "issuers"]
    verbs: ["get", "list", "watch"]
  # Read pods for health checks
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list"]
  # Read secrets for OpenBao token (if using token auth)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
    resourceNames: ["openbao-prometheus-token"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pki-exporter
  labels:
    app.kubernetes.io/name: pki-exporter
    app.kubernetes.io/part-of: machine-identity-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pki-exporter
subjects:
  - kind: ServiceAccount
    name: pki-exporter
    namespace: monitoring
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pki-exporter-script
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pki-exporter
    app.kubernetes.io/part-of: machine-identity-platform
data:
  exporter.py: |
    #!/usr/bin/env python3
    """
    PKI Exporter — lightweight Prometheus exporter for PKI platform metrics.

    Queries EJBCA, OpenBao, SPIRE, PostgreSQL, and Kubernetes APIs to expose
    derived metrics that applications do not natively provide.

    Endpoints:
      /metrics  — Prometheus text exposition
      /healthz  — liveness probe
      /readyz   — readiness probe
    """

    import os
    import sys
    import time
    import json
    import logging
    import urllib.request
    import urllib.error
    import ssl
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from datetime import datetime, timezone

    # ---------------------------------------------------------------------------
    # Configuration
    # ---------------------------------------------------------------------------
    EJBCA_BASE_URL = os.environ.get("EJBCA_BASE_URL", "http://ejbca-ejbca-ce.ejbca.svc:8080/ejbca")
    OPENBAO_ADDR = os.environ.get("OPENBAO_ADDR", "https://openbao.openbao.svc:8200")
    SPIRE_SERVER_ADDR = os.environ.get("SPIRE_SERVER_ADDR", "spire-server.spire.svc:8081")
    POSTGRES_HOST = os.environ.get("POSTGRES_HOST", "postgres-postgresql.postgres.svc")
    POSTGRES_PORT = os.environ.get("POSTGRES_PORT", "5432")
    POSTGRES_DB = os.environ.get("POSTGRES_DB", "ejbcadb")
    POSTGRES_USER = os.environ.get("POSTGRES_USER", "ejbca")
    POSTGRES_PASSWORD = os.environ.get("POSTGRES_PASSWORD", "")
    EXPORTER_PORT = int(os.environ.get("EXPORTER_PORT", "9102"))
    EXPORTER_INTERVAL = int(os.environ.get("EXPORTER_INTERVAL", "30"))
    LOG_LEVEL = os.environ.get("LOG_LEVEL", "INFO")

    logging.basicConfig(
        level=getattr(logging, LOG_LEVEL),
        format="%(asctime)s %(levelname)s %(message)s",
        stream=sys.stdout,
    )
    log = logging.getLogger("pki-exporter")

    # ---------------------------------------------------------------------------
    # Helpers
    # ---------------------------------------------------------------------------
    def http_get(url, timeout=10, insecure=False):
        """Simple HTTP GET with optional TLS skip-verify."""
        ctx = ssl.create_default_context()
        if insecure:
            ctx.check_hostname = False
            ctx.verify_mode = ssl.CERT_NONE
        req = urllib.request.Request(url, headers={"Accept": "application/json"})
        try:
            with urllib.request.urlopen(req, timeout=timeout, context=ctx) as resp:
                return resp.status, resp.read().decode("utf-8", errors="replace")
        except urllib.error.HTTPError as e:
            return e.code, e.read().decode("utf-8", errors="replace")
        except Exception as e:
            log.debug(f"HTTP GET {url} failed: {e}")
            return None, str(e)

    def parse_prometheus_text(text):
        """Very naive Prometheus text parser — extracts metric name and value."""
        metrics = {}
        for line in text.splitlines():
            line = line.strip()
            if not line or line.startswith("#"):
                continue
            parts = line.split()
            if len(parts) >= 2:
                name = parts[0].split("{")[0]
                try:
                    metrics[name] = float(parts[1])
                except ValueError:
                    pass
        return metrics

    # ---------------------------------------------------------------------------
    # Collectors
    # ---------------------------------------------------------------------------
    def collect_ejbca():
        """Collect EJBCA metrics via REST API and health endpoint."""
        metrics = {}

        # Health probe
        status, body = http_get(f"{EJBCA_BASE_URL}/publicweb/healthz")
        metrics["pki_ejbca_up"] = 1.0 if status == 200 else 0.0

        # CA status — query EJBCA REST API for CA list
        # EJBCA CE REST API: GET /ejbca/ejbca-rest-api/v1/ca
        status, body = http_get(f"{EJBCA_BASE_URL}/ejbca-rest-api/v1/ca")
        if status == 200:
            try:
                cas = json.loads(body)
                active = sum(1 for ca in cas if ca.get("status") == "ACTIVE")
                metrics["pki_ejbca_ca_status"] = 1.0 if active > 0 else 0.0
                metrics["pki_ejbca_ca_count"] = float(len(cas))
            except json.JSONDecodeError:
                metrics["pki_ejbca_ca_status"] = 0.0
        else:
            metrics["pki_ejbca_ca_status"] = 0.0

        # Certificate counts — derived from EJBCA database via REST or direct query
        # EJBCA CE does not expose these natively; we use the REST API search endpoint
        # GET /ejbca/ejbca-rest-api/v1/certificate/search
        # For simplicity, we expose placeholders that can be replaced by direct DB queries.
        metrics["pki_ejbca_certificates_issued_total"] = 0.0
        metrics["pki_ejbca_issuance_failures_total"] = 0.0
        metrics["pki_ejbca_renewal_failures_total"] = 0.0
        metrics["pki_ejbca_revocation_events_total"] = 0.0

        # Expiring certificates — derived from cert-manager + EJBCA data
        # These are populated by the cert-manager collector below
        metrics["pki_ejbca_certificates_expiring_7d"] = 0.0
        metrics["pki_ejbca_certificates_expiring_30d"] = 0.0
        metrics["pki_ejbca_certificates_expiring_90d"] = 0.0

        return metrics

    def collect_openbao():
        """Collect OpenBao metrics via sys/metrics and sys/seal-status."""
        metrics = {}

        # Seal status
        status, body = http_get(f"{OPENBAO_ADDR}/v1/sys/seal-status", insecure=True)
        if status == 200:
            try:
                data = json.loads(body)
                metrics["pki_openbao_seal_state"] = 1.0 if data.get("sealed") else 0.0
                metrics["pki_openbao_up"] = 1.0
            except json.JSONDecodeError:
                metrics["pki_openbao_seal_state"] = 1.0
                metrics["pki_openbao_up"] = 0.0
        else:
            metrics["pki_openbao_seal_state"] = 1.0
            metrics["pki_openbao_up"] = 0.0

        # Prometheus metrics endpoint (requires token)
        # If a token is available, scrape /v1/sys/metrics?format=prometheus
        # For now, we derive availability from seal-status
        metrics["pki_openbao_availability"] = metrics["pki_openbao_up"]

        return metrics

    def collect_spire():
        """Collect SPIRE server metrics."""
        metrics = {}

        # SPIRE server health — TCP connect or HTTP health endpoint
        # SPIRE server exposes a health endpoint on :8080/healthz when configured
        # For now, we use a simple TCP connect check
        import socket
        try:
            host, port = SPIRE_SERVER_ADDR.split(":")
            sock = socket.create_connection((host, int(port)), timeout=5)
            sock.close()
            metrics["pki_spire_server_up"] = 1.0
        except Exception:
            metrics["pki_spire_server_up"] = 0.0

        # SVID expiration — derived from SPIRE server API or agent metrics
        # Placeholder: would query SPIRE server for SVID TTL
        metrics["pki_spire_svid_expiration_seconds"] = 3600.0  # default 1h

        return metrics

    def collect_postgres():
        """Collect PostgreSQL metrics."""
        metrics = {}

        # Simple TCP connectivity check
        import socket
        try:
            sock = socket.create_connection((POSTGRES_HOST, int(POSTGRES_PORT)), timeout=5)
            sock.close()
            metrics["pki_postgresql_up"] = 1.0
        except Exception:
            metrics["pki_postgresql_up"] = 0.0

        # Connection count and storage would require pg exporter or direct query
        # Placeholders — replace with postgres_exporter in production
        metrics["pki_postgresql_connections"] = 0.0
        metrics["pki_postgresql_storage_bytes"] = 0.0

        return metrics

    def collect_cert_manager():
        """Collect cert-manager certificate expiry metrics from Kubernetes API."""
        metrics = {}

        # Use Kubernetes API to list cert-manager Certificates
        # This requires the exporter to run in-cluster with appropriate RBAC
        try:
            from kubernetes import client, config
            config.load_incluster_config()
            api = client.CustomObjectsApi()

            certs = api.list_cluster_custom_object(
                group="cert-manager.io",
                version="v1",
                plural="certificates",
            )

            now = datetime.now(timezone.utc).timestamp()
            expiring_7d = 0
            expiring_30d = 0
            expiring_90d = 0

            for cert in certs.get("items", []):
                status = cert.get("status", {})
                not_after = status.get("notAfter")
                if not_after:
                    try:
                        expiry = datetime.fromisoformat(not_after.replace("Z", "+00:00")).timestamp()
                        days_left = (expiry - now) / 86400
                        if days_left < 7:
                            expiring_7d += 1
                        if days_left < 30:
                            expiring_30d += 1
                        if days_left < 90:
                            expiring_90d += 1
                    except ValueError:
                        pass

            metrics["pki_certificates_expiring_7d"] = float(expiring_7d)
            metrics["pki_certificates_expiring_30d"] = float(expiring_30d)
            metrics["pki_certificates_expiring_90d"] = float(expiring_90d)
            metrics["pki_certificates_total"] = float(len(certs.get("items", [])))

        except Exception as e:
            log.debug(f"cert-manager collector failed: {e}")
            metrics["pki_certificates_expiring_7d"] = 0.0
            metrics["pki_certificates_expiring_30d"] = 0.0
            metrics["pki_certificates_expiring_90d"] = 0.0
            metrics["pki_certificates_total"] = 0.0

        return metrics

    def collect_external_ca():
        """Collect external CA gateway metrics."""
        metrics = {}

        # External CA gateways are probed via blackbox exporter; here we
        # expose derived metrics for gateway availability and API reachability.
        # These would be populated by querying the external-ca-gateway service
        # or by reading blackbox probe results from Prometheus.
        metrics["pki_external_ca_gateway_up"] = 0.0
        metrics["pki_external_ca_api_reachable"] = 0.0
        metrics["pki_external_ca_requests_total"] = 0.0
        metrics["pki_external_ca_issuance_total"] = 0.0
        metrics["pki_external_ca_issuance_failures_total"] = 0.0
        metrics["pki_external_ca_renewal_failures_total"] = 0.0
        metrics["pki_external_ca_revocation_failures_total"] = 0.0
        metrics["pki_external_ca_auth_failures_total"] = 0.0
        metrics["pki_external_ca_rate_limit_total"] = 0.0

        return metrics

    # ---------------------------------------------------------------------------
    # HTTP Handler
    # ---------------------------------------------------------------------------
    class ExporterHandler(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path == "/metrics":
                self.send_response(200)
                self.send_header("Content-Type", "text/plain; version=0.0.4")
                self.end_headers()

                all_metrics = {}
                all_metrics.update(collect_ejbca())
                all_metrics.update(collect_openbao())
                all_metrics.update(collect_spire())
                all_metrics.update(collect_postgres())
                all_metrics.update(collect_cert_manager())
                all_metrics.update(collect_external_ca())

                lines = []
                for name, value in sorted(all_metrics.items()):
                    lines.append(f"# TYPE {name} gauge")
                    lines.append(f"{name} {value}")

                self.wfile.write("\n".join(lines).encode())
                self.wfile.write(b"\n")

            elif self.path == "/healthz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok\n")

            elif self.path == "/readyz":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok\n")

            else:
                self.send_response(404)
                self.end_headers()

        def log_message(self, format, *args):
            log.debug(format % args)

    # ---------------------------------------------------------------------------
    # Main
    # ---------------------------------------------------------------------------
    def main():
        server = HTTPServer(("0.0.0.0", EXPORTER_PORT), ExporterHandler)
        log.info(f"pki-exporter listening on :{EXPORTER_PORT}")
        server.serve_forever()

    if __name__ == "__main__":
        main()
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pki-exporter
  namespace: monitoring
  labels:
    monitoring.pki.platform.io/enabled: "true"
    app.kubernetes.io/part-of: machine-identity-platform
    component: exporter
spec:
  namespaceSelector:
    matchNames: [monitoring]
  selector:
    matchLabels:
      app.kubernetes.io/name: pki-exporter
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
