# Grafana admin credentials for the monitoring stack.
# In real deployments this is a SealedSecret / ExternalSecret / SOPS secret.
# This file documents the expected shape; the actual secret material must
# be injected per environment (see docs/monitoring/prometheus.md#secrets).
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: machine-identity-platform
type: Opaque
stringData:
  admin-user: admin
  # REPLACE per environment. Homelab default only.
  admin-password: changeme-grafana-admin
