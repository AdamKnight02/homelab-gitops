# Default-deny; state-ui may only receive from the internal ingress/SSO proxy
# and the monitoring namespace (scraping), and may only egress to state-api + DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: state-ui
  namespace: state-system
  labels:
    app.kubernetes.io/name: state-ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: state-ui
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-internal
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: state-api
      ports:
        - port: 8080
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
