# Homelab Overlay
# Local K3s cluster at 192.168.122.74
# Uses existing app configurations directly

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: homelab-overlay
  annotations:
    environment: homelab
    description: "Local K3s homelab overlay"

# Reference to base
resources:
  - ../../base

# Homelab-specific patches can be added here
# patches:
#   - path: patches/resource-limits.yaml
#     target:
#       kind: Deployment

commonLabels:
  environment: homelab
  cluster: k3s-homelab
