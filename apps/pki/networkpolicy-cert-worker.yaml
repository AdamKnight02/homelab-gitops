apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-worker-egress
  namespace: pki
  labels:
    app: cert-worker
spec:
  podSelector:
    matchLabels:
      app: cert-worker
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: spire
    ports:
    - protocol: TCP
      port: 8081
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openbao
    ports:
    - protocol: TCP
      port: 8200
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 443
